plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = 'MaxHenkel'
        url = 'https://maven.maxhenkel.de/repository/public'
        content {
            includeGroup('de.maxhenkel.voicechat')
        }
    }
}

configurations {
    productionAcceptanceInstaller {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    productionAcceptanceRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"

    modLocalRuntime "maven.modrinth:simple-voice-chat:fabric-${voicechat_version}"
    modLocalRuntime "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}:fabric-stub"
    modLocalRuntime "maven.modrinth:sodium:${sodium_version}"
    //modLocalRuntime "maven.modrinth:iris:${iris_version}"
    modLocalRuntime "maven.modrinth:ferrite-core:${ferritecore_version}"
    modLocalRuntime "maven.modrinth:packet-fixer:${packetfixer_version}"

    productionAcceptanceInstaller "net.fabricmc:fabric-installer:${fabric_installer_version}"
    productionAcceptanceRuntimeMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    productionAcceptanceRuntimeMods "maven.modrinth:simple-voice-chat:fabric-${voicechat_version}"
}

def devUsername = providers.gradleProperty('mca_dev_username').orElse('Dev').get()

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.classtweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "${mod_id}.refmap.json"
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
            programArgs("--username", devUsername)
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'mca-acceptance-test'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }

    configureDataGeneration {
        addToResources = false
        client = true
        createRunConfiguration = true
        createSourceSet = true
        modId = "${mod_id}-datagen"
        outputDirectory = rootProject.project(':common').file('src/generated/resources')
        strictValidation = true
    }
}

def remappedFabricJar = tasks.named('remapJar').flatMap { it.archiveFile }
def refmapEntryName = "${project.property('mod_id')}.refmap.json"

def verifyFabricRefmap = tasks.register('verifyFabricRefmap') {
    group = 'verification'
    description = 'Requires the distributable Fabric JAR to contain valid startup-safe production metadata, Mixins, navigation, tombstone and resurrection hooks without GameTest leakage.'
    dependsOn tasks.named('remapJar')
    inputs.file(remappedFabricJar)

    doLast {
        def jarFile = remappedFabricJar.get().asFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def fabricMetadataEntry = zip.getEntry('fabric.mod.json')
            if (fabricMetadataEntry == null) {
                throw new GradleException("Distributable Fabric JAR is missing fabric.mod.json: ${jarFile}")
            }
            def fabricMetadataText = zip.getInputStream(fabricMetadataEntry).getText('UTF-8')
            def fabricMetadata = new groovy.json.JsonSlurper().parseText(fabricMetadataText)
            def productionModId = refmapEntryName.substring(0, refmapEntryName.length() - '.refmap.json'.length())
            if (fabricMetadata.id != productionModId) {
                throw new GradleException(
                        "Production fabric.mod.json must declare id ${productionModId}, found ${fabricMetadata.id}: ${jarFile}"
                )
            }
            if (fabricMetadataText.contains('mca-acceptance-test')) {
                throw new GradleException(
                        "Production fabric.mod.json must not contain the GameTest mod id mca-acceptance-test: ${jarFile}"
                )
            }
            if (fabricMetadata.entrypoints instanceof Map
                    && fabricMetadata.entrypoints.containsKey('fabric-gametest')) {
                throw new GradleException(
                        "Production fabric.mod.json must not declare a fabric-gametest entrypoint: ${jarFile}"
                )
            }

            String leakedGameTestEntry = null
            def jarEntries = zip.entries()
            while (jarEntries.hasMoreElements()) {
                def entry = jarEntries.nextElement()
                if (entry.name.startsWith('net/conczin/mca/gametest/')) {
                    leakedGameTestEntry = entry.name
                    break
                }
            }
            if (leakedGameTestEntry != null) {
                throw new GradleException(
                        "Distributable Fabric JAR must not contain GameTest classes, found ${leakedGameTestEntry}: ${jarFile}"
                )
            }

            def mixinConfigEntry = zip.getEntry('mca.mixins.json')
            if (mixinConfigEntry == null) {
                throw new GradleException("Distributable Fabric JAR is missing mca.mixins.json: ${jarFile}")
            }

            def mixinConfig = new groovy.json.JsonSlurper().parse(
                    zip.getInputStream(mixinConfigEntry),
                    'UTF-8'
            )
            if (mixinConfig.refmap != refmapEntryName) {
                throw new GradleException(
                        "mca.mixins.json must declare ${refmapEntryName}, found ${mixinConfig.refmap}: ${jarFile}"
                )
            }

            def refmapEntry = zip.getEntry(refmapEntryName)
            if (refmapEntry == null) {
                throw new GradleException("Distributable Fabric JAR is missing required ${refmapEntryName}: ${jarFile}")
            }

            def refmap = new groovy.json.JsonSlurper().parse(
                    zip.getInputStream(refmapEntry),
                    'UTF-8'
            )
            if (!(refmap instanceof Map) || !(refmap.mappings instanceof Map)) {
                throw new GradleException("Distributable Fabric JAR contains an invalid ${refmapEntryName}: ${jarFile}")
            }

            def livingEntityMappings = refmap.mappings['net/conczin/mca/mixin/MixinLivingEntity']
            def jumpingTarget = livingEntityMappings instanceof Map
                    ? livingEntityMappings['setJumping']
                    : null
            def expectedJumpingTarget = 'Lnet/minecraft/class_1309;method_6100(Z)V'
            if (jumpingTarget != expectedJumpingTarget) {
                throw new GradleException(
                        "${refmapEntryName} must map MixinLivingEntity.setJumping to ${expectedJumpingTarget}, found ${jumpingTarget}: ${jarFile}"
                )
            }

            def mobMappings = refmap.mappings['net/conczin/mca/mixin/MixinMob']
            if (mobMappings instanceof Map && mobMappings.containsKey('setJumping')) {
                throw new GradleException(
                        "${refmapEntryName} must not map setJumping through MixinMob: ${jarFile}"
                )
            }

            def commonMixins = mixinConfig.mixins instanceof List ? mixinConfig.mixins : []
            if (commonMixins.contains('MixinTombstoneBlock')) {
                throw new GradleException(
                        "mca.mixins.json must not register MixinTombstoneBlock for owned TombstoneBlock behavior: ${jarFile}"
                )
            }
            if (zip.getEntry('net/conczin/mca/mixin/MixinTombstoneBlock.class') != null) {
                throw new GradleException(
                        "Distributable Fabric JAR must not contain obsolete MixinTombstoneBlock.class: ${jarFile}"
                )
            }
            if (refmap.mappings['net/conczin/mca/mixin/MixinTombstoneBlock'] != null) {
                throw new GradleException(
                        "${refmapEntryName} must not contain obsolete MixinTombstoneBlock mappings: ${jarFile}"
                )
            }

            def tombstoneBlockEntry = zip.getEntry('net/conczin/mca/block/TombstoneBlock.class')
            if (tombstoneBlockEntry == null) {
                throw new GradleException("Distributable Fabric JAR is missing TombstoneBlock.class: ${jarFile}")
            }
            def tombstoneBlockConstants = new String(
                    zip.getInputStream(tombstoneBlockEntry).bytes,
                    java.nio.charset.StandardCharsets.ISO_8859_1
            )
            if (!tombstoneBlockConstants.contains('net/conczin/mca/block/TombstoneDropPolicy')
                    || !tombstoneBlockConstants.contains('ensurePreservedDrop')) {
                throw new GradleException(
                        "TombstoneBlock must wire TombstoneDropPolicy.ensurePreservedDrop directly: ${jarFile}"
                )
            }

            if (!commonMixins.contains('MixinGroundPathNavigation')) {
                throw new GradleException(
                        "mca.mixins.json must register MixinGroundPathNavigation: ${jarFile}"
                )
            }

            def groundNavigationMappings = refmap.mappings['net/conczin/mca/mixin/MixinGroundPathNavigation']
            def surfaceTarget = groundNavigationMappings instanceof Map
                    ? groundNavigationMappings['getSurfaceY']
                    : null
            if (!(surfaceTarget instanceof String) || !surfaceTarget.endsWith('()I')) {
                throw new GradleException(
                        "${refmapEntryName} must map MixinGroundPathNavigation.getSurfaceY to an int-returning target, found ${surfaceTarget}: ${jarFile}"
                )
            }

            def groundMixinEntry = zip.getEntry('net/conczin/mca/mixin/MixinGroundPathNavigation.class')
            if (groundMixinEntry == null) {
                throw new GradleException(
                        "Distributable Fabric JAR is missing MixinGroundPathNavigation.class: ${jarFile}"
                )
            }

            def navigationEntry = zip.getEntry(
                    'net/conczin/mca/entity/ai/navigation/MCAGroundPathNavigation.class'
            )
            if (navigationEntry == null) {
                throw new GradleException(
                        "Distributable Fabric JAR is missing MCAGroundPathNavigation.class: ${jarFile}"
                )
            }

            def navigationMethods = [] as Set
            def navigationBytes = zip.getInputStream(navigationEntry).bytes
            new org.objectweb.asm.ClassReader(navigationBytes).accept(
                    new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9) {
                        @Override
                        org.objectweb.asm.MethodVisitor visitMethod(
                                int access,
                                String name,
                                String descriptor,
                                String signature,
                                String[] exceptions
                        ) {
                            navigationMethods.add(name + descriptor)
                            return null
                        }
                    },
                    org.objectweb.asm.ClassReader.SKIP_CODE
                            | org.objectweb.asm.ClassReader.SKIP_DEBUG
                            | org.objectweb.asm.ClassReader.SKIP_FRAMES
            )
            if (!navigationMethods.contains('mca$getWaterAwareSurfaceY()I')) {
                throw new GradleException(
                        "MCAGroundPathNavigation must expose mca\$getWaterAwareSurfaceY()I: ${jarFile}"
                )
            }
            if (navigationMethods.any { it.startsWith('getTempMobPos(') }) {
                throw new GradleException(
                        "MCAGroundPathNavigation must preserve inherited GroundPathNavigation.getTempMobPos(): ${jarFile}"
                )
            }

            if (commonMixins.contains('MixinTombstoneData')) {
                throw new GradleException(
                        "mca.mixins.json must not inject into TombstoneBlock.Data synthetic resurrection lambda: ${jarFile}"
                )
            }

            def tombstoneDataEntry = zip.getEntry('net/conczin/mca/block/TombstoneBlock$Data.class')
            if (tombstoneDataEntry == null) {
                throw new GradleException("Distributable Fabric JAR is missing TombstoneBlock$Data.class: ${jarFile}")
            }

            def tombstoneDataBytes = zip.getInputStream(tombstoneDataEntry).bytes
            def tombstoneDataConstants = new String(tombstoneDataBytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            if (!tombstoneDataConstants.contains('net/conczin/mca/entity/ai/brain/tasks/MourningMemoryLifecycle')
                    || !tombstoneDataConstants.contains('clearAfterResurrection')) {
                throw new GradleException(
                        "TombstoneBlock.Data must call MourningMemoryLifecycle.clearAfterResurrection directly: ${jarFile}"
                )
            }
        } finally {
            zip.close()
        }
    }
}

def productionAcceptanceStageDir = layout.buildDirectory.dir('production-acceptance/stage')

def sha256Of = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[128 * 1024]
        int read
        while ((read = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    return digest.digest().encodeHex().toString()
}

def readFabricModMetadata = { File jarFile ->
    def zip = new java.util.zip.ZipFile(jarFile)
    try {
        def entry = zip.getEntry('fabric.mod.json')
        if (entry == null) {
            throw new GradleException("Fabric mod JAR is missing fabric.mod.json: ${jarFile}")
        }
        def metadata = new groovy.json.JsonSlurper().parse(
                zip.getInputStream(entry),
                'UTF-8'
        )
        if (!(metadata instanceof Map)
                || !(metadata.id instanceof String)
                || metadata.id.trim().isEmpty()
                || !(metadata.version instanceof String)
                || metadata.version.trim().isEmpty()) {
            throw new GradleException("Fabric mod metadata must contain non-empty id and version: ${jarFile}")
        }
        return [id: metadata.id.trim(), version: metadata.version.trim()]
    } finally {
        zip.close()
    }
}

def stageProductionAcceptanceRuntime = tasks.register('stageProductionAcceptanceRuntime') {
    group = 'verification'
    description = 'Stages the exact remapped VillAIgence candidate, pinned Fabric installer and mandatory production runtime mods.'
    dependsOn verifyFabricRefmap
    inputs.file(remappedFabricJar)
    inputs.files(configurations.productionAcceptanceInstaller)
    inputs.files(configurations.productionAcceptanceRuntimeMods)
    inputs.property('minecraftVersion', project.property('minecraft_version'))
    inputs.property('loaderVersion', project.property('fabric_loader_version'))
    inputs.property('installerVersion', project.property('fabric_installer_version'))
    outputs.dir(productionAcceptanceStageDir)

    doLast {
        def installerFiles = configurations.productionAcceptanceInstaller.files
                .toList()
                .sort { left, right -> left.name <=> right.name }
        if (installerFiles.size() != 1) {
            throw new GradleException(
                    "Production acceptance requires exactly one Fabric Installer JAR, found ${installerFiles.size()}: ${installerFiles}"
            )
        }

        def runtimeFiles = configurations.productionAcceptanceRuntimeMods.files
                .toList()
                .sort { left, right -> left.name <=> right.name }
        if (runtimeFiles.size() != 2) {
            throw new GradleException(
                    "Production acceptance requires exactly two runtime mod JARs, found ${runtimeFiles.size()}: ${runtimeFiles}"
            )
        }

        def stageDir = productionAcceptanceStageDir.get().asFile
        project.delete(stageDir)
        def installerDir = new File(stageDir, 'installer')
        def modsDir = new File(stageDir, 'mods')
        installerDir.mkdirs()
        modsDir.mkdirs()

        def stagedInstaller = new File(installerDir, 'fabric-installer.jar')
        java.nio.file.Files.copy(
                installerFiles[0].toPath(),
                stagedInstaller.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )

        def candidateSource = remappedFabricJar.get().asFile
        def candidateMetadata = readFabricModMetadata(candidateSource)
        if (candidateMetadata.id != project.property('mod_id').toString()) {
            throw new GradleException(
                    "Production acceptance candidate must declare id ${project.property('mod_id')}, found ${candidateMetadata.id}"
            )
        }
        def stagedCandidate = new File(modsDir, 'villaigence-under-test.jar')
        java.nio.file.Files.copy(
                candidateSource.toPath(),
                stagedCandidate.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )

        def expectedRuntimeIds = ['fabric-api', 'voicechat'] as Set
        def runtimeMetadata = runtimeFiles.collect { runtimeFile ->
            def metadata = readFabricModMetadata(runtimeFile)
            [source: runtimeFile, id: metadata.id, version: metadata.version]
        }.sort { left, right -> left.id <=> right.id }
        def actualRuntimeIds = runtimeMetadata.collect { it.id } as Set
        if (actualRuntimeIds != expectedRuntimeIds || runtimeMetadata.size() != expectedRuntimeIds.size()) {
            throw new GradleException(
                    "Production acceptance runtime mods must be exactly ${expectedRuntimeIds}, found ${runtimeMetadata.collect { it.id }}"
            )
        }

        def stagedRuntime = runtimeMetadata.collect { metadata ->
            def safeVersion = metadata.version.replaceAll('[^0-9A-Za-z.+_-]', '_')
            def target = new File(modsDir, "${metadata.id}-${safeVersion}.jar")
            java.nio.file.Files.copy(
                    metadata.source.toPath(),
                    target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
            [
                    id: metadata.id,
                    version: metadata.version,
                    path: stageDir.toPath().relativize(target.toPath()).toString().replace(File.separatorChar, '/' as char),
                    sha256: sha256Of(target),
                    size: target.length()
            ]
        }

        def artifact = { File file ->
            [
                    path: stageDir.toPath().relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char),
                    sha256: sha256Of(file),
                    size: file.length()
            ]
        }

        def manifest = [
                schema: 1,
                minecraftVersion: project.property('minecraft_version').toString(),
                loaderVersion: project.property('fabric_loader_version').toString(),
                installerVersion: project.property('fabric_installer_version').toString(),
                installer: artifact(stagedInstaller),
                candidate: artifact(stagedCandidate) + [
                        id: candidateMetadata.id,
                        version: candidateMetadata.version
                ],
                runtimeMods: stagedRuntime
        ]

        def manifestFile = new File(stageDir, 'manifest.json')
        manifestFile.setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n',
                'UTF-8'
        )
        logger.lifecycle("Staged production acceptance runtime: ${stageDir}")
        logger.lifecycle("Candidate ${candidateMetadata.id} ${candidateMetadata.version}: ${sha256Of(stagedCandidate)}")
    }
}

tasks.named('check') {
    dependsOn verifyFabricRefmap
}

