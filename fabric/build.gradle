plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = 'MaxHenkel'
        url = 'https://maven.maxhenkel.de/repository/public'
        content {
            includeGroup('de.maxhenkel.voicechat')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"

    modLocalRuntime "maven.modrinth:simple-voice-chat:fabric-${voicechat_version}"
    modLocalRuntime "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}:fabric-stub"
    modLocalRuntime "maven.modrinth:sodium:${sodium_version}"
    //modLocalRuntime "maven.modrinth:iris:${iris_version}"
    modLocalRuntime "maven.modrinth:ferrite-core:${ferritecore_version}"
    modLocalRuntime "maven.modrinth:packet-fixer:${packetfixer_version}"
}

def devUsername = providers.gradleProperty('mca_dev_username').orElse('Dev').get()
def generatingFabricMetadata = gradle.startParameter.taskNames.any {
    it == ':fabric:build' || it == 'fabric:build'
}
def verificationMetadataFile = rootProject.file('gradle/verification-metadata.xml')
def originalVerificationMetadata = generatingFabricMetadata && verificationMetadataFile.exists()
        ? verificationMetadataFile.bytes
        : null

def mixinProcessorConfigurations = ['annotationProcessor', 'datagenAnnotationProcessor']

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.classtweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "${mod_id}.refmap.json"
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
            programArgs("--username", devUsername)
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

fabricApi {
    configureDataGeneration {
        addToResources = false
        client = true
        createRunConfiguration = true
        createSourceSet = true
        modId = "${mod_id}-datagen"
        outputDirectory = rootProject.project(':common').file('src/generated/resources')
        strictValidation = true
    }
}

if (generatingFabricMetadata) {
    mixinProcessorConfigurations.each { configurationName ->
        configurations.named(configurationName) {
            resolutionStrategy.deactivateDependencyLocking()
        }
    }
}

def remappedFabricJar = tasks.named('remapJar').flatMap { it.archiveFile }
def refmapEntryName = "${project.property('mod_id')}.refmap.json"

def verifyFabricRefmap = tasks.register('verifyFabricRefmap') {
    group = 'verification'
    description = 'Requires the distributable Fabric JAR to contain a valid non-empty Mixin refmap.'
    dependsOn tasks.named('remapJar')
    inputs.file(remappedFabricJar)

    doLast {
        def jarFile = remappedFabricJar.get().asFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entry = zip.getEntry(refmapEntryName)
            if (entry == null) {
                throw new GradleException("Distributable Fabric JAR is missing required ${refmapEntryName}: ${jarFile}")
            }

            def text = zip.getInputStream(entry).getText('UTF-8').trim()
            if (text.isEmpty()) {
                throw new GradleException("Distributable Fabric JAR contains an empty ${refmapEntryName}: ${jarFile}")
            }

            def parsed = new groovy.json.JsonSlurper().parseText(text)
            if (!(parsed instanceof Map) || parsed.isEmpty()) {
                throw new GradleException("Distributable Fabric JAR contains an invalid ${refmapEntryName}: ${jarFile}")
            }
        } finally {
            zip.close()
        }
    }
}

def emitGeneratedFabricMetadata = tasks.register('emitGeneratedFabricMetadata') {
    group = 'verification'
    dependsOn tasks.named('verifyFabricRefmap')

    doLast {
        def reportDir = rootProject.file('build/reports/dependencies/refmap-hotfix')
        reportDir.mkdirs()

        try {
            if (!verificationMetadataFile.isFile()) {
                throw new GradleException('Gradle did not generate verification-metadata.xml')
            }
            new File(reportDir, 'verification-metadata.xml').bytes = verificationMetadataFile.bytes

            def lockFile = file('gradle.lockfile')
            def lines = lockFile.readLines('UTF-8')
            def headers = lines.findAll { it.startsWith('#') }
            def entries = new TreeMap<String, String>()
            lines.findAll { !it.startsWith('#') && it.contains('=') }.each { line ->
                def separator = line.indexOf('=')
                entries.put(line.substring(0, separator), line.substring(separator + 1))
            }

            def annotationProcessorCoordinates = [
                    'io.github.llamalad7:mixinextras-fabric:0.5.4',
                    'net.fabricmc:fabric-mixin-compile-extensions:0.6.0',
                    'net.fabricmc:mapping-io:0.2.1',
                    'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7',
                    'org.ow2.asm:asm-analysis:9.10.1',
                    'org.ow2.asm:asm-commons:9.10.1',
                    'org.ow2.asm:asm-tree:9.10.1',
                    'org.ow2.asm:asm-util:9.10.1',
                    'org.ow2.asm:asm:9.10.1'
            ]
            annotationProcessorCoordinates.each { coordinate ->
                def resolvedConfigurations = entries.containsKey(coordinate)
                        ? entries.get(coordinate).split(',').findAll { !it.isEmpty() }.toList()
                        : []
                resolvedConfigurations.addAll(mixinProcessorConfigurations)
                entries.put(coordinate, resolvedConfigurations.unique().sort().join(','))
            }

            if (entries.containsKey('empty')) {
                def emptyConfigurations = entries.get('empty')
                        .split(',')
                        .findAll { !it.isEmpty() && !mixinProcessorConfigurations.contains(it) }
                        .toList()
                entries.put('empty', emptyConfigurations.join(','))
            }

            def generatedLock = new StringBuilder()
            headers.each { generatedLock.append(it).append('\n') }
            entries.each { coordinate, configurations ->
                generatedLock.append(coordinate).append('=').append(configurations).append('\n')
            }
            new File(reportDir, 'fabric.gradle.lockfile').setText(generatedLock.toString(), 'UTF-8')

            def jarFile = remappedFabricJar.get().asFile
            java.nio.file.Files.copy(
                    jarFile.toPath(),
                    new File(reportDir, jarFile.name).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )

            def zip = new java.util.zip.ZipFile(jarFile)
            try {
                def refmap = zip.getEntry(refmapEntryName)
                new File(reportDir, refmapEntryName).bytes = zip.getInputStream(refmap).bytes
            } finally {
                zip.close()
            }
        } finally {
            if (originalVerificationMetadata != null) {
                verificationMetadataFile.bytes = originalVerificationMetadata
            }
        }
    }
}

tasks.named('check') {
    dependsOn verifyFabricRefmap
}

if (generatingFabricMetadata) {
    tasks.named('build') {
        finalizedBy emitGeneratedFabricMetadata
    }
}
