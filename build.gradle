plugins {
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

def nativeAccessJvmArgs = ['--enable-native-access=ALL-UNNAMED']

allprojects {
    dependencyLocking {
        lockAllConfigurations()
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).tap {
            configureEach {
                options.deprecation = true
                options.compilerArgs << "-Xmaxerrs" << "1000" << "-Xlint:deprecation" << "-Xlint:unchecked"
            }
        }

        tasks.configureEach { task ->
            if (task instanceof JavaForkOptions) {
                if (task.maxHeapSize == null) {
                    task.maxHeapSize = '4G'
                }
                nativeAccessJvmArgs.each { nativeAccessJvmArg ->
                    if (!task.jvmArgs.contains(nativeAccessJvmArg)) {
                        task.jvmArgs(nativeAccessJvmArg)
                    }
                }
            }
        }
    }
}

tasks.register('dependencyManifest') {
    group = 'verification'
    description = 'Writes a deterministic sorted manifest from committed dependency lockfiles.'
    inputs.files(
            layout.projectDirectory.file('common/gradle.lockfile'),
            layout.projectDirectory.file('fabric/gradle.lockfile'),
            layout.projectDirectory.file('neoforge/gradle.lockfile')
    )
    outputs.file(layout.buildDirectory.file('reports/dependencies/villaigence-dependencies.txt'))

    doLast { task ->
        def coordinates = new TreeSet<String>()
        task.inputs.files.files
                .toList()
                .sort { left, right -> left.path <=> right.path }
                .each { lockfile ->
                    lockfile.readLines('UTF-8').each { line ->
                        def trimmed = line.trim()
                        if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                            return
                        }
                        def separator = trimmed.indexOf('=')
                        if (separator > 0) {
                            coordinates.add(trimmed.substring(0, separator))
                        }
                    }
                }

        def output = task.outputs.files.singleFile
        output.parentFile.mkdirs()
        def lines = [
                '# VillAIgence locked dependency manifest',
                '# Generated by Gradle task :dependencyManifest; sorted and timestamp-free.',
                '# Source of truth: committed common/fabric/neoforge Gradle lockfiles.'
        ]
        lines.addAll(coordinates)
        output.setText(lines.join('\n') + '\n', 'UTF-8')
    }
}

def releaseVersionPattern = ~/^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?[+][0-9]+([.][0-9]+){1,2}$/

def validateReleaseVersion = { String candidate, String source ->
    def normalized = candidate == null ? '' : candidate.trim()
    if (normalized.isEmpty() || !(normalized ==~ releaseVersionPattern)) {
        throw new GradleException(
                "Invalid ${source}: expected '<mod_version>+<minecraft_version>', found '${normalized}'"
        )
    }

    def declaredMinecraftVersion = normalized.substring(normalized.lastIndexOf('+') + 1)
    def configuredMinecraftVersion = rootProject.property('minecraft_version').toString()
    if (declaredMinecraftVersion != configuredMinecraftVersion) {
        throw new GradleException(
                "Invalid ${source}: declares Minecraft ${declaredMinecraftVersion}, "
                        + "but gradle.properties declares ${configuredMinecraftVersion}"
        )
    }

    return normalized
}

def getAppVersion = { ->
    def explicitVersion = providers.gradleProperty('release_version').orNull
    if (explicitVersion != null && !explicitVersion.trim().isEmpty()) {
        return validateReleaseVersion(explicitVersion, 'release_version')
    }

    try {
        def rawTags = providers.exec {
            commandLine 'git', 'tag', '--points-at', 'HEAD'
        }.standardOutput.asText.get()
        def tags = rawTags.readLines()
                .collect { it.trim() }
                .findAll { !it.isEmpty() }
                .sort()

        if (tags.isEmpty()) {
            return rootProject.minecraft_version + "-SNAPSHOT"
        }
        if (tags.size() != 1) {
            throw new GradleException(
                    "Ambiguous release version: expected exactly one tag at HEAD, found ${tags}"
            )
        }
        return validateReleaseVersion(tags[0], 'Git tag')
    } catch (GradleException e) {
        throw e
    } catch (Exception e) {
        println "Warning: ${e.message}, is git installed?"
        return rootProject.minecraft_version + "-DEV"
    }
} as Object

allprojects {
    version = getAppVersion()
}
