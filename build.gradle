plugins {
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

def nativeAccessJvmArgs = ['--enable-native-access=ALL-UNNAMED']

def manifestConfigurationNames = [
        'compileClasspath',
        'runtimeClasspath',
        'testCompileClasspath',
        'testRuntimeClasspath'
] as Set

allprojects {
    dependencyLocking {
        lockAllConfigurations()
    }

    configurations.configureEach {
        resolutionStrategy {
            failOnDynamicVersions()
            failOnChangingVersions()
        }
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).tap {
            configureEach {
                options.deprecation = true
                options.compilerArgs << "-Xmaxerrs" << "1000" << "-Xlint:deprecation" << "-Xlint:unchecked"
            }
        }

        tasks.configureEach { task ->
            if (task instanceof JavaForkOptions) {
                if (task.maxHeapSize == null) {
                    task.maxHeapSize = '4G'
                }
                nativeAccessJvmArgs.each { nativeAccessJvmArg ->
                    if (!task.jvmArgs.contains(nativeAccessJvmArg)) {
                        task.jvmArgs(nativeAccessJvmArg)
                    }
                }
            }
        }
    }
}

def dependencyManifestFile = layout.buildDirectory.file('reports/dependencies/villaigence-dependencies.txt')

tasks.register('dependencyManifest') {
    group = 'verification'
    description = 'Writes a deterministic sorted manifest of resolved external build dependencies.'
    outputs.file(dependencyManifestFile)

    doLast {
        def coordinates = new TreeSet<String>()
        subprojects.sort { left, right -> left.path <=> right.path }.each { project ->
            project.configurations
                    .findAll { configuration ->
                        configuration.canBeResolved && manifestConfigurationNames.contains(configuration.name)
                    }
                    .sort { left, right -> left.name <=> right.name }
                    .each { configuration ->
                        configuration.incoming.resolutionResult.allComponents.each { component ->
                            def identifier = component.id
                            if (identifier instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                                coordinates.add("${identifier.group}:${identifier.module}:${identifier.version}")
                            }
                        }
                    }
        }

        def output = dependencyManifestFile.get().asFile
        output.parentFile.mkdirs()
        def lines = [
                '# VillAIgence resolved dependency manifest',
                '# Generated by Gradle task :dependencyManifest; sorted and timestamp-free.',
                *coordinates
        ]
        output.setText(lines.join('\n') + '\n', 'UTF-8')
    }
}

def getAppVersion = { ->
    try {
        def tag = providers.exec {
            commandLine 'git', 'tag', '--points-at', 'HEAD'
        }.standardOutput.asText.get().trim()
        if (tag.isEmpty()) {
            return rootProject.minecraft_version + "-SNAPSHOT"
        }
        return tag
    } catch (Exception e) {
        println "Warning: ${e.message}, is git installed?"
        return rootProject.minecraft_version + "-DEV"
    }
} as Object

allprojects {
    version = getAppVersion()
}
