name: Phase E lifecycle focused

on:
  push:
    branches:
      - 'agent/m11-phase-e-automation-completion'

permissions:
  contents: read

jobs:
  lifecycle-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Run production lifecycle and process contract tests
        run: |
          python3 scripts/ci/test_production_lifecycle_acceptance.py
          python3 scripts/ci/test_production_server_process.py
