name: One-shot orchestration config

on:
  push:
    branches:
      - agent/m11-phase-c-orchestration-deadline
    paths:
      - .github/workflows/one-shot-orchestration-config.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/m11-phase-c-orchestration-deadline
          fetch-depth: 0

      - name: Add bounded voice-turn timeout config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          config = Path('common/src/main/java/net/conczin/mca/livingworld/LivingWorldConfig.java')
          replace_once(
              config,
              '''    public int voiceSilenceMillis = 800;
              public int voiceMinMillis = 250;
              public int voiceMaxSeconds = 20;
              public float voiceDistance = 32.0f;

              public int connectTimeoutSeconds = 10;
          ''',
              '''    public int voiceSilenceMillis = 800;
              public int voiceMinMillis = 250;
              public int voiceMaxSeconds = 20;
              public float voiceDistance = 32.0f;
              /** Total monotonic budget for queueing, STT, Chat and optional TTS in one captured turn. */
              public int voiceConversationTimeoutSeconds = 120;

              public int connectTimeoutSeconds = 10;
          ''',
              'config field'
          )
          replace_once(
              config,
              '''        if (voiceMaxSeconds <= 0) voiceMaxSeconds = 20;
                      if (voiceDistance <= 0) voiceDistance = 32.0f;
                      if (connectTimeoutSeconds <= 0) connectTimeoutSeconds = 10;
          ''',
              '''        if (voiceMaxSeconds <= 0) voiceMaxSeconds = 20;
                      if (voiceDistance <= 0) voiceDistance = 32.0f;
                      if (voiceConversationTimeoutSeconds <= 0) voiceConversationTimeoutSeconds = 120;
                      voiceConversationTimeoutSeconds = Math.max(10, Math.min(300, voiceConversationTimeoutSeconds));
                      if (connectTimeoutSeconds <= 0) connectTimeoutSeconds = 10;
          ''',
              'config normalization'
          )

          test = Path('common/src/test/java/net/conczin/mca/livingworld/LivingWorldConfigTest.java')
          replace_once(
              test,
              '''        assertEquals(20, config.voiceMaxSeconds);
                      assertEquals(10, config.connectTimeoutSeconds);
          ''',
              '''        assertEquals(20, config.voiceMaxSeconds);
                      assertEquals(120, config.voiceConversationTimeoutSeconds);
                      assertEquals(10, config.connectTimeoutSeconds);
          ''',
              'default assertion'
          )
          marker = '''    @Test
              void providerSpecificEnvironmentKeyWinsOverConfiguredKey() {
          '''
          addition = '''    @Test
              void voiceConversationTimeoutDefaultsAndClampsWithoutConfigVersionMigration() {
                  LivingWorldConfig omitted = LivingWorldConfig.parseJson("""
                          {"version":2,"voiceInputEnabled":true}
                          """);
                  assertEquals(120, omitted.voiceConversationTimeoutSeconds);

                  LivingWorldConfig tooSmall = LivingWorldConfig.parseJson("""
                          {"version":2,"voiceConversationTimeoutSeconds":3}
                          """);
                  assertEquals(10, tooSmall.voiceConversationTimeoutSeconds);

                  LivingWorldConfig tooLarge = LivingWorldConfig.parseJson("""
                          {"version":2,"voiceConversationTimeoutSeconds":999}
                          """);
                  assertEquals(300, tooLarge.voiceConversationTimeoutSeconds);

                  LivingWorldConfig invalid = LivingWorldConfig.parseJson("""
                          {"version":2,"voiceConversationTimeoutSeconds":0}
                          """);
                  assertEquals(120, invalid.voiceConversationTimeoutSeconds);
              }

          ''' + marker
          replace_once(test, marker, addition, 'config test insertion')
          PY
          grep -Fq 'voiceConversationTimeoutSeconds = 120' common/src/main/java/net/conczin/mca/livingworld/LivingWorldConfig.java
          grep -Fq 'Math.max(10, Math.min(300, voiceConversationTimeoutSeconds))' common/src/main/java/net/conczin/mca/livingworld/LivingWorldConfig.java
          git diff --check

      - name: Commit config contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/src/main/java/net/conczin/mca/livingworld/LivingWorldConfig.java common/src/test/java/net/conczin/mca/livingworld/LivingWorldConfigTest.java
          git commit -m 'feat: configure bounded voice conversation deadline'
          git push origin HEAD:agent/m11-phase-c-orchestration-deadline
