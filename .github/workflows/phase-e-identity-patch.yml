name: Phase E identity patch

on:
  push:
    branches:
      - 'agent/m11-phase-e-automation-completion'

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout -B agent/m11-phase-e-automation-completion FETCH_HEAD

      - name: Use Java 21 from runner image
        run: |
          if [ -n "${JAVA_HOME_21_X64:-}" ] && [ -d "$JAVA_HOME_21_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_21_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
            echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
            echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          fi
          java -version

      - name: Apply exact reviewed source replacement
        run: |
          python3 scripts/ci/apply_phase_e_identity_patch.py
          git diff --check
          git diff -- common/src/main/java/net/conczin/mca/block/TombstoneBlock.java

      - name: Verify focused GameTests before committing
        run: |
          chmod +x gradlew
          ./gradlew :fabric:runGameTest --stacktrace --no-daemon --console=plain
          grep -Fq 'VAI-LIFE-005-AUTOMATED-PASS' fabric/build/run/gameTest/logs/latest.log

      - name: Commit verified production fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/src/main/java/net/conczin/mca/block/TombstoneBlock.java
          git commit -m "fix: reject destructive duplicate identity replay"
          git push origin HEAD:agent/m11-phase-e-automation-completion
