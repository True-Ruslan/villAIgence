name: One-shot scope release request

on:
  push:
    branches:
      - fix/configuration-cache-refmap-verifier
    paths:
      - .github/workflows/one-shot-scope-release-request.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/configuration-cache-refmap-verifier
          fetch-depth: 0

      - name: Scope release requests to request-file changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/livingworld-release.yml')
          source = path.read_text(encoding='utf-8')

          step_anchor = '''        id: release-meta
                shell: bash
                run: |
          '''
          step_replacement = '''        id: release-meta
                shell: bash
                env:
                  PUSH_BEFORE_SHA: ${{ github.event.before }}
                run: |
          '''
          if source.count(step_anchor) != 1 or 'PUSH_BEFORE_SHA:' in source:
              raise SystemExit('unexpected release metadata step state')
          source = source.replace(step_anchor, step_replacement)

          old = '''          elif [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'branch' ]]; then
                      if [[ "${GITHUB_REF_NAME}" != '1.21.1' ]]; then
                        echo "::error title=Invalid release branch::Release requests may run only from 1.21.1."
                        exit 1
                      fi
                      test -s "${request_file}"
                      release_tag="$(sed -e 's/\\r$//' -e '/^[[:space:]]*$/d' "${request_file}")"
                      release_mode='request'
                      publish_release='true'
                    elif [[ "${GITHUB_EVENT_NAME}" == 'pull_request' && -s "${request_file}" ]]; then
                      release_tag="$(sed -e 's/\\r$//' -e '/^[[:space:]]*$/d' "${request_file}")"
                      release_mode='request-validation'
          '''
          new = '''          elif [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'branch' ]]; then
                      if [[ "${GITHUB_REF_NAME}" != '1.21.1' ]]; then
                        echo "::error title=Invalid release branch::Release requests may run only from 1.21.1."
                        exit 1
                      fi
                      if [[ -n "${PUSH_BEFORE_SHA:-}" \
                            && "${PUSH_BEFORE_SHA}" != '0000000000000000000000000000000000000000' ]]; then
                        if ! git diff --quiet "${PUSH_BEFORE_SHA}" HEAD -- "${request_file}"; then
                          test -s "${request_file}"
                          release_tag="$(sed -e 's/\\r$//' -e '/^[[:space:]]*$/d' "${request_file}")"
                          release_mode='request'
                          publish_release='true'
                        fi
                      fi
                    elif [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
                      git fetch origin \
                        "refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
                      if ! git diff --quiet \
                          "refs/remotes/origin/${GITHUB_BASE_REF}" \
                          HEAD \
                          -- "${request_file}"; then
                        test -s "${request_file}"
                        release_tag="$(sed -e 's/\\r$//' -e '/^[[:space:]]*$/d' "${request_file}")"
                        release_mode='request-validation'
                      fi
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected one legacy release-request block, found {source.count(old)}')
          source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')

          Path('.github/workflows/one-shot-scope-release-request.yml').unlink()
          PY

          grep -Fq 'PUSH_BEFORE_SHA: ${{ github.event.before }}' .github/workflows/livingworld-release.yml
          grep -Fq 'git diff --quiet "${PUSH_BEFORE_SHA}" HEAD -- "${request_file}"' .github/workflows/livingworld-release.yml
          grep -Fq 'refs/remotes/origin/${GITHUB_BASE_REF}' .github/workflows/livingworld-release.yml
          ! grep -Fq "pull_request' && -s \"${request_file}\"" .github/workflows/livingworld-release.yml
          git diff --check

      - name: Commit release-request scoping
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: scope release request to request-file changes'
          git push origin HEAD:fix/configuration-cache-refmap-verifier
