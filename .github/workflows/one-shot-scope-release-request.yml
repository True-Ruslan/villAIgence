name: One-shot scope release request

on:
  push:
    branches:
      - fix/configuration-cache-refmap-verifier
    paths:
      - .github/workflows/one-shot-scope-release-request.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/configuration-cache-refmap-verifier
          fetch-depth: 0

      - name: Scope release requests to request-file changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/livingworld-release.yml')
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines()

          id_line = '        id: release-meta'
          try:
              metadata_index = lines.index(id_line)
          except ValueError as exc:
              raise SystemExit('release metadata step id is missing') from exc
          if lines[metadata_index + 1] != '        shell: bash':
              raise SystemExit('release metadata shell line is unexpected')
          if lines[metadata_index + 2] != '        run: |':
              raise SystemExit('release metadata run line is unexpected')
          if any('PUSH_BEFORE_SHA:' in line for line in lines):
              raise SystemExit('release metadata push-before env already exists')

          expression = '$' + '{{ github.event.before }}'
          lines[metadata_index + 2:metadata_index + 2] = [
              '        env:',
              f'          PUSH_BEFORE_SHA: {expression}',
          ]
          source = '\n'.join(lines) + '\n'

          branch_start_text = '''          elif [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'branch' ]]; then
          '''
          metadata_end_text = '''          fi

                    if [[ "${release_tag}" == *$'\\n'* || "${release_tag}" =~ [[:space:]] ]]; then
          '''
          branch_start = source.index(branch_start_text)
          metadata_end = source.index(metadata_end_text, branch_start)

          replacement = '''          elif [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'branch' ]]; then
                      if [[ "${GITHUB_REF_NAME}" != '1.21.1' ]]; then
                        echo "::error title=Invalid release branch::Release requests may run only from 1.21.1."
                        exit 1
                      fi
                      if [[ -n "${PUSH_BEFORE_SHA:-}" \
                            && "${PUSH_BEFORE_SHA}" != '0000000000000000000000000000000000000000' ]]; then
                        if ! git diff --quiet "${PUSH_BEFORE_SHA}" HEAD -- "${request_file}"; then
                          test -s "${request_file}"
                          release_tag="$(sed -e 's/\\r$//' -e '/^[[:space:]]*$/d' "${request_file}")"
                          release_mode='request'
                          publish_release='true'
                        fi
                      fi
                    elif [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
                      git fetch origin \
                        "refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
                      if ! git diff --quiet \
                          "refs/remotes/origin/${GITHUB_BASE_REF}" \
                          HEAD \
                          -- "${request_file}"; then
                        test -s "${request_file}"
                        release_tag="$(sed -e 's/\\r$//' -e '/^[[:space:]]*$/d' "${request_file}")"
                        release_mode='request-validation'
                      fi
          '''
          source = source[:branch_start] + replacement + source[metadata_end:]
          path.write_text(source, encoding='utf-8')

          Path('.github/workflows/one-shot-scope-release-request.yml').unlink()
          PY

          grep -Fq 'PUSH_BEFORE_SHA:' .github/workflows/livingworld-release.yml
          grep -Fq 'git diff --quiet "${PUSH_BEFORE_SHA}" HEAD -- "${request_file}"' .github/workflows/livingworld-release.yml
          grep -Fq 'refs/remotes/origin/${GITHUB_BASE_REF}' .github/workflows/livingworld-release.yml
          ! grep -Fq 'pull_request'\'' && -s "${request_file}"' .github/workflows/livingworld-release.yml
          git diff --check

      - name: Commit release-request scoping
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: scope release request to request-file changes'
          git push origin HEAD:fix/configuration-cache-refmap-verifier
