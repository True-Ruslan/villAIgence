name: Repository security policy

on:
  pull_request:
    branches:
      - '1.21.1'

permissions:
  contents: write

jobs:
  bootstrap-step1-closure:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'docs/step1-security-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact documentation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: docs/step1-security-closure
          fetch-depth: 0

      - name: Apply canonical Step 1 documentation patch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "True-Ruslan/villAIgence"
          test "${GITHUB_HEAD_REF}" = "docs/step1-security-closure"
          python3 .github/step1_security_docs_patch.py

      - name: Restore permanent read-only workflow and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 6d82b4e4650294a4a42b9ea2113e64d990e08811
          git show 6d82b4e4650294a4a42b9ea2113e64d990e08811:.github/workflows/security-policy.yml > .github/workflows/security-policy.yml
          rm -f .github/workflows/step1-security-docs-bootstrap.yml
          rm -f .github/step1_security_docs_patch.py
          git diff --check

      - name: Commit canonical closure documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/security-policy.yml \
            .github/workflows/step1-security-docs-bootstrap.yml \
            .github/step1_security_docs_patch.py \
            docs/PROJECT_STATE.md \
            docs/CHANGELOG.md \
            docs/security/H5_LEGACY_TOOLS_AUDIT_CLOSURE_2026-07-31.md \
            docs/security/README.md \
            docs/security/STEP_1_TRACKER.md
          git diff --cached --exit-code && {
            echo "Expected documentation changes were not produced" >&2
            exit 1
          } || true
          git commit -m "docs: reconcile Step 1 security closure"
          git push origin HEAD:docs/step1-security-closure
