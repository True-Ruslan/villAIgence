name: Repository security policy

on:
  pull_request:
    branches:
      - '1.21.1'
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'agent/**'
      - '1.21.1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run deterministic repository security policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/repository_security_policy.py --check
          test -s build/security/script-inventory.json

      - name: Upload deterministic script inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: villaigence-script-inventory
          path: build/security/script-inventory.json
          if-no-files-found: error
          retention-days: 14
