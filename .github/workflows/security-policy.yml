name: Repository security policy

on:
  pull_request:
    branches:
      - '1.21.1'

permissions:
  contents: write

jobs:
  bootstrap-runtime-validation-rebase:
    if: >-
      github.repository == 'True-Ruslan/villAIgence' &&
      github.event.pull_request.head.ref == 'docs/validate-0.1.15-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact documentation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: docs/validate-0.1.15-runtime
          fetch-depth: 0

      - name: Apply rebased canonical runtime validation patch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "True-Ruslan/villAIgence"
          test "${GITHUB_HEAD_REF}" = "docs/validate-0.1.15-runtime"
          python3 .github/runtime_validation_rebase_patch.py

      - name: Restore permanent read-only workflow and remove bootstrap file
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 1924a64e8f1b38c326b75966a829291cd29d178e
          git show 1924a64e8f1b38c326b75966a829291cd29d178e:.github/workflows/security-policy.yml > .github/workflows/security-policy.yml
          rm -f .github/runtime_validation_rebase_patch.py
          git diff --check

      - name: Commit rebased runtime validation documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.md docs/CHANGELOG.md docs/security/README.md docs/security/STEP_1_TRACKER.md .github/workflows/security-policy.yml .github/runtime_validation_rebase_patch.py
          git commit -m "docs: reconcile 0.1.15 validation on current state"
          git push origin HEAD:docs/validate-0.1.15-runtime
