name: One-shot M11 Phase C structural cleanup

on:
  push:
    branches:
      - agent/m11-phase-c-mock-provider
    paths:
      - .github/workflows/one-shot-m11-phase-c-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/m11-phase-c-mock-provider
          fetch-depth: 0

      - name: Normalize test ownership and source spacing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old_test = Path('common/src/test/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAIHttpIntegrationTest.java')
          new_test = Path('common/src/test/java/net/conczin/mca/livingworld/ai/ChatCompletionHttpClientIntegrationTest.java')
          if not old_test.is_file() or new_test.exists():
              raise SystemExit('unexpected chat integration test path state')
          source = old_test.read_text(encoding='utf-8')
          source = source.replace(
              'package net.conczin.mca.entity.ai.chatAI;\n',
              'package net.conczin.mca.livingworld.ai;\n'
          )
          source = source.replace('import net.conczin.mca.livingworld.ai.ChatCompletionHttpClient;\n', '')
          source = source.replace('import net.conczin.mca.livingworld.ai.ProviderEndpoint;\n', '')
          source = source.replace('import net.conczin.mca.livingworld.ai.ProviderEndpointPolicy;\n', '')
          source = source.replace(
              'class OpenAIChatAIHttpIntegrationTest {',
              'class ChatCompletionHttpClientIntegrationTest {'
          )
          source = source.replace(
              '            assertNotNull(result.get().error());\n',
              '            assertEquals(ChatCompletionHttpClient.REQUEST_DEADLINE_ERROR, result.get().error());\n'
          )
          new_test.parent.mkdir(parents=True, exist_ok=True)
          new_test.write_text(source, encoding='utf-8')
          old_test.unlink()

          chat = Path('common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java')
          source = chat.read_text(encoding='utf-8')
          source = source.replace(
              '        return new ParsedProviderAnswer(new Answer(reply, null), completion);\n    }\n    private static String parseError(',
              '        return new ParsedProviderAnswer(new Answer(reply, null), completion);\n    }\n\n    private static String parseError('
          )
          source = source.replace(
              '        return parseCompletion(result.completion()).answer();\n    }\n    private static void logProviderFailure(',
              '        return parseCompletion(result.completion()).answer();\n    }\n\n    private static void logProviderFailure('
          )
          chat.write_text(source, encoding='utf-8')

          transport = Path('common/src/main/java/net/conczin/mca/livingworld/ai/ChatCompletionHttpClient.java')
          source = transport.read_text(encoding='utf-8')
          source = source.replace(
              ' * bounded response reads, completion parsing, bounded retry count and one end-to-end deadline\n * shared by every attempt.</p>',
              ' * bounded response reads, completion parsing, bounded retry count and one connect/read deadline\n * shared by every attempt.</p>'
          )
          transport.write_text(source, encoding='utf-8')

          Path('.github/workflows/one-shot-m11-phase-c-cleanup.yml').unlink()
          PY

          test -f common/src/test/java/net/conczin/mca/livingworld/ai/ChatCompletionHttpClientIntegrationTest.java
          test ! -e common/src/test/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAIHttpIntegrationTest.java
          grep -Fq 'REQUEST_DEADLINE_ERROR' common/src/test/java/net/conczin/mca/livingworld/ai/ChatCompletionHttpClientIntegrationTest.java
          git diff --check

      - name: Commit structural cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align mock-provider tests with transport ownership'
          git push origin HEAD:agent/m11-phase-c-mock-provider
