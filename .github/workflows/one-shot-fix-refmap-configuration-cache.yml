name: One-shot fix refmap configuration cache

on:
  push:
    branches:
      - fix/configuration-cache-refmap-verifier
    paths:
      - .github/workflows/one-shot-fix-refmap-configuration-cache.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/configuration-cache-refmap-verifier
          fetch-depth: 0

      - name: Remove execution-time Project access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('fabric/build.gradle')
          source = path.read_text(encoding='utf-8')
          old = "            def productionModId = project.property('mod_id').toString()\n"
          new = "            def productionModId = refmapEntryName.substring(0, refmapEntryName.length() - '.refmap.json'.length())\n"
          if source.count(old) != 1:
              raise SystemExit(f'expected one configuration-cache-unsafe lookup, found {source.count(old)}')
          source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')

          workflow = Path('.github/workflows/one-shot-fix-refmap-configuration-cache.yml')
          workflow.unlink()
          PY

          ! grep -Fq "def productionModId = project.property('mod_id').toString()" fabric/build.gradle
          grep -Fq "def productionModId = refmapEntryName.substring(" fabric/build.gradle
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make Fabric refmap verifier configuration-cache safe'
          git push origin HEAD:fix/configuration-cache-refmap-verifier
