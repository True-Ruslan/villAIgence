name: Phase B store source diagnostic

on:
  pull_request:
    branches:
      - '1.21.1'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact source head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Inspect application-owned persistence entrypoints
        run: |
          set -euo pipefail
          {
            echo '=== livingworld source files ==='
            find common/src/main/java/net/conczin/mca/livingworld -type f -print | sort
            echo
            echo '=== canonical filename references ==='
            grep -RInE 'memory\.json|memory2\.json|semantic-memory\.json|relationships\.json|voices\.json|operator-lore\.json' \
              common/src/main/java fabric/src/main/java neoforge/src/main/java || true
            echo
            echo '=== save/load/lifecycle candidates ==='
            grep -RInE 'SERVER_STARTED|SERVER_STOPPING|ServerLifecycleEvents|save\(|load\(|flush\(|initialize|bootstrap|WorldSavePath|LevelResource|worldPath|serverDirectory' \
              common/src/main/java/net/conczin/mca/livingworld fabric/src/main/java neoforge/src/main/java | head -n 1200 || true
          } | tee build-store-diagnostic.txt
