name: LivingWorld CI

on:
  pull_request:
    branches:
      - '1.21.1'
  push:
    branches:
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and Fabric build
        run: ./gradlew :common:test :fabric:build --stacktrace
