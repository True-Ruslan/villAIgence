name: VillAIgence CI

on:
  pull_request:
    branches:
      - '1.21.1'
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - '1.21.1'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Use Java 21 from runner image
        run: |
          if [ -n "${JAVA_HOME_21_X64:-}" ] && [ -d "$JAVA_HOME_21_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_21_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
            echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
            echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          fi
          java -version

      - name: Run acceptance suite selector contract tests
        run: python3 scripts/ci/test_select_acceptance_suites.py

      - name: Select acceptance suites
        id: acceptance
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          selection_dir='build/acceptance-selection'
          changed_paths="${selection_dir}/changed-paths.txt"
          mkdir -p "${selection_dir}"

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              test -n "${GITHUB_BASE_REF:-}"
              test -n "${PR_BASE_SHA:-}"
              git fetch --no-tags --depth=1 origin "${PR_BASE_SHA}"
              git diff --name-only "${PR_BASE_SHA}" HEAD \
                | sed '/^[[:space:]]*$/d' \
                | sort -u \
                > "${changed_paths}"
              selection_mode='pr'
              ;;
            push)
              if [[ -n "${PUSH_BEFORE_SHA:-}" \
                    && "${PUSH_BEFORE_SHA}" != '0000000000000000000000000000000000000000' ]]; then
                git fetch --no-tags --depth=1 origin "${PUSH_BEFORE_SHA}"
                git diff --name-only "${PUSH_BEFORE_SHA}" HEAD \
                  | sed '/^[[:space:]]*$/d' \
                  | sort -u \
                  > "${changed_paths}"
              else
                : > "${changed_paths}"
              fi
              selection_mode='push'
              ;;
            *)
              : > "${changed_paths}"
              selection_mode='push'
              ;;
          esac

          python3 scripts/ci/select_acceptance_suites.py \
            --mode "${selection_mode}" \
            --changed-paths-file "${changed_paths}" \
            --github-output "$GITHUB_OUTPUT"

          echo 'Changed paths:'
          cat "${changed_paths}"

      - name: Verify exact release identity contract
        run: |
          chmod +x gradlew scripts/ci/test-release-version-contract.sh
          scripts/ci/test-release-version-contract.sh

      - name: Inventory workflow action references
        run: |
          find .github/workflows -maxdepth 1 -type f -print -exec grep -HnE '^[[:space:]]*-?[[:space:]]*uses:' {} \; | sort

      - name: Run repository security policy
        run: |
          python3 scripts/ci/repository_security_policy.py --check
          test -s build/security/script-inventory.json

      - name: Run common and deterministic mock-provider tests
        if: steps.acceptance.outputs.fast == 'true'
        run: |
          chmod +x gradlew
          ./gradlew \
            :common:test \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Run risk catalog, server GameTests and supported loader builds
        if: steps.acceptance.outputs.server == 'true'
        run: |
          chmod +x gradlew
          set +e
          ./gradlew \
            :common:test \
            :fabric:runGameTest \
            :fabric:build \
            :neoforge:build \
            --stacktrace \
            --no-daemon \
            > gradle-build.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "Gradle or GameTest failed; extracted Gradle diagnostics:"
            grep -En "error:|FAILURE:|What went wrong:|Execution failed|Could not|Caused by:|FAILED|GameTest|test failed" gradle-build.log | tail -n 160 || true

            echo "--- extracted Minecraft/GameTest diagnostics ---"
            while IFS= read -r log_file; do
              grep -HEn "VillAIgenceGameTests|TombstoneControlGameTests|TombstoneInventoryDeathGameTests|TombstoneIdentityReplayGameTests|NavigationWaterSurfaceGameTests|NavigationObstacleGameTests|NavigationLadderGameTests|NavigationDoorGameTests|GameplayInteractionGameTests|MountedArcherControlGameTests|ControlledNavigationMob|test failed|required test|Failed required test|GameTest|Exception" "$log_file" | tail -n 240 || true
            done < <(find fabric -type f \( -name '*.log' -o -name '*.txt' \) -print | sort)

            echo "--- final 120 Gradle log lines ---"
            tail -n 120 gradle-build.log
            exit "$status"
          fi

          grep -Fq 'VAI-LIFE-005-AUTOMATED-PASS' \
            fabric/build/run/gameTest/logs/latest.log
          echo "Risk catalog, server GameTests and loader builds succeeded; final 20 log lines:"
          tail -n 20 gradle-build.log

      - name: Run production acceptance contract tests
        if: steps.acceptance.outputs.fast == 'true'
        run: |
          python3 scripts/ci/test_production_server_acceptance.py
          python3 scripts/ci/test_production_server_process.py
          python3 scripts/ci/test_production_lifecycle_acceptance.py
          python3 scripts/ci/test_persistence_recovery_acceptance.py

      - name: Stage and execute production server acceptance
        if: steps.acceptance.outputs.production == 'true'
        run: |
          chmod +x gradlew
          ./gradlew \
            :fabric:stageProductionAcceptanceRuntime \
            --stacktrace \
            --no-daemon \
            --console=plain

          rm -rf build/production-server-acceptance
          mkdir -p build/production-server-acceptance/evidence
          python3 scripts/ci/production_server_acceptance_strict.py \
            --stage-dir fabric/build/production-acceptance/stage \
            --execute \
            --work-dir build/production-server-acceptance/work \
            --report-dir build/production-server-acceptance/evidence \
            --java "${JAVA_HOME}/bin/java" \
            --installer-timeout-seconds 300 \
            --startup-timeout-seconds 240 \
            --shutdown-timeout-seconds 60 \
            --max-heap-mib 768

          grep -Fq 'VILLAIGENCE_PRODUCTION_FIXTURE_READY' \
            build/production-server-acceptance/evidence/server-run-1.log
          grep -Fq 'VILLAIGENCE_PRODUCTION_FIXTURE_READY' \
            build/production-server-acceptance/evidence/server-run-2.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('build/production-server-acceptance/evidence/acceptance-report.json')
              .read_text(encoding='utf-8')
          )
          if report.get('status') != 'PASS':
              raise SystemExit('production acceptance report is not PASS')
          PY

          python3 scripts/ci/production_lifecycle_acceptance.py \
            --server-root build/production-server-acceptance/work/server \
            --report build/production-server-acceptance/evidence/lifecycle-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('build/production-server-acceptance/evidence/lifecycle-report.json')
              .read_text(encoding='utf-8')
          )
          if report.get('status') != 'PASS':
              raise SystemExit('production lifecycle report is not PASS')
          PY

      - name: Upload production acceptance evidence
        if: always() && steps.acceptance.outputs.production == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-server-acceptance-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: build/production-server-acceptance/evidence

      - name: Execute selected persistence recovery matrix
        if: steps.acceptance.outputs.recovery == 'true'
        run: |
          set -euo pipefail
          test -s fabric/build/production-acceptance/stage/manifest.json
          rm -rf build/persistence-recovery-acceptance
          mkdir -p build/persistence-recovery-acceptance/evidence
          python3 scripts/ci/persistence_recovery_acceptance.py \
            --stage-dir fabric/build/production-acceptance/stage \
            --execute \
            --work-dir build/persistence-recovery-acceptance/work \
            --report-dir build/persistence-recovery-acceptance/evidence \
            --java "${JAVA_HOME}/bin/java" \
            --installer-timeout-seconds 300 \
            --startup-timeout-seconds 180 \
            --shutdown-timeout-seconds 60 \
            --max-heap-mib 768
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('build/persistence-recovery-acceptance/evidence/persistence-recovery-report.json')
              .read_text(encoding='utf-8')
          )
          cases = report.get('cases')
          if report.get('status') != 'PASS':
              raise SystemExit('persistence recovery report is not PASS')
          if not isinstance(cases, list) or len(cases) != 6:
              raise SystemExit('persistence recovery report must contain six cases')
          if any(case.get('status') != 'PASS' for case in cases):
              raise SystemExit('at least one persistence recovery case is not PASS')
          PY

      - name: Upload selected persistence recovery evidence
        if: always() && steps.acceptance.outputs.recovery == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persistence-recovery-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: build/persistence-recovery-acceptance/evidence

      - name: Verify distributable VillAIgence Fabric package
        if: steps.acceptance.outputs.package == 'true'
        run: |
          chmod +x scripts/ci/package-livingworld-release.sh
          scripts/ci/package-livingworld-release.sh "ci-${GITHUB_RUN_NUMBER}" false ci-dist
