name: VillAIgence CI

on:
  pull_request:
    branches:
      - '1.21.1'
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - '1.21.1'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Use Java 21 from runner image
        run: |
          if [ -n "${JAVA_HOME_21_X64:-}" ] && [ -d "$JAVA_HOME_21_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_21_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
            echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
            echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          fi
          java -version

      - name: Inventory workflow action references
        run: |
          find .github/workflows -maxdepth 1 -type f -print -exec grep -HnE '^[[:space:]]*-?[[:space:]]*uses:' {} \; | sort

      - name: Run repository security policy
        run: |
          python3 scripts/ci/repository_security_policy.py --check
          test -s build/security/script-inventory.json

      - name: Run unit tests and supported loader builds
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :common:test :fabric:build :neoforge:build --stacktrace --no-daemon > gradle-build.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "Gradle failed; extracted diagnostics:"
            grep -En "error:|FAILURE:|What went wrong:|Execution failed|Could not|Caused by:|FAILED" gradle-build.log | tail -n 120 || true
            echo "--- final 80 log lines ---"
            tail -n 80 gradle-build.log
            exit "$status"
          fi

          echo "Gradle succeeded; final 10 log lines:"
          tail -n 10 gradle-build.log

      - name: Verify distributable VillAIgence Fabric package
        run: |
          chmod +x scripts/ci/package-livingworld-release.sh
          scripts/ci/package-livingworld-release.sh "ci-${GITHUB_RUN_NUMBER}" false ci-dist
