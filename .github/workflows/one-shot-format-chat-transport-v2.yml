name: One-shot format Chat transport v2

on:
  push:
    branches:
      - agent/m11-phase-c-orchestration-deadline
    paths:
      - .github/workflows/one-shot-format-chat-transport-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/m11-phase-c-orchestration-deadline
          fetch-depth: 0
      - name: Remove blank line from Chat diagnostic signature
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java')
          source = path.read_text(encoding='utf-8')
          old = '    private static void logProviderFailure(\n\n            String model,'
          new = '    private static void logProviderFailure(\n            String model,'
          if source.count(old) != 1:
              raise SystemExit(f'expected one diagnostic signature gap, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit final formatting correction
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java
          git commit -m 'style: normalize Chat diagnostic signature'
          git push origin HEAD:agent/m11-phase-c-orchestration-deadline
