name: One-shot format Chat transport v2

on:
  push:
    branches:
      - agent/m11-phase-c-orchestration-deadline
    paths:
      - .github/workflows/one-shot-format-chat-transport-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/m11-phase-c-orchestration-deadline
          fetch-depth: 0
      - name: Normalize Chat transport indentation deterministically
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java')
          source = path.read_text(encoding='utf-8')
          pattern = r'''    private static Answer post\(AiProviderSettings settings, String requestBody, String token\) \{.*?^private static void logProviderFailure\('''
          region = textwrap.dedent('''
          private static Answer post(AiProviderSettings settings, String requestBody, String token) {
              return post(settings, requestBody, token, null);
          }

          private static Answer post(
                  AiProviderSettings settings,
                  String requestBody,
                  String token,
                  @Nullable AiRequestDeadline deadline
          ) {
              return post(
                      settings.endpoint(),
                      requestBody,
                      token,
                      settings.connectTimeoutMillis(),
                      settings.readTimeoutMillis(),
                      settings.model(),
                      deadline
              );
          }

          private static Answer post(
                  ProviderEndpoint endpoint,
                  String requestBody,
                  String token,
                  int connectTimeoutMillis,
                  int readTimeoutMillis,
                  String model,
                  @Nullable AiRequestDeadline deadline
          ) {
              ChatCompletionHttpClient.AttemptObserver observer = new ChatCompletionHttpClient.AttemptObserver() {
                  @Override
                  public void onProviderFailure(
                          int attempt,
                          ChatCompletionResponseParser.ParsedCompletion completion
                  ) {
                      logProviderFailure(model, attempt, completion);
                  }

                  @Override
                  public void onEmptyCompletion(
                          int attempt,
                          ChatCompletionResponseParser.ParsedCompletion completion,
                          boolean retrying
                  ) {
                      logEmptyCompletion(model, attempt, completion, retrying);
                  }
              };
              ChatCompletionHttpClient.Result result = deadline == null
                      ? ChatCompletionHttpClient.post(
                              endpoint,
                              requestBody,
                              token,
                              connectTimeoutMillis,
                              readTimeoutMillis,
                              observer
                      )
                      : ChatCompletionHttpClient.post(
                              endpoint,
                              requestBody,
                              token,
                              connectTimeoutMillis,
                              readTimeoutMillis,
                              deadline,
                              observer
                      );

              if (result.failure() instanceof BoundedResponseReader.ResponseTooLargeException exception) {
                  MCA.LOGGER.warn(
                          "AI provider response exceeded safe byte limit: limit={}, observed={}",
                          exception.limitBytes(),
                          exception.observedBytes()
                  );
              } else if (result.failure() != null) {
                  MCA.LOGGER.error("AI provider request failed", result.failure());
              }
              if (result.error() != null) {
                  return new Answer(null, result.error());
              }
              return parseCompletion(result.completion()).answer();
          }

          private static void logProviderFailure(
          ''').lstrip()
          replacement = textwrap.indent(region, '    ')
          updated, count = re.subn(pattern, replacement, source, count=1, flags=re.MULTILINE | re.DOTALL)
          if count != 1:
              raise SystemExit(f'expected one malformed Chat transport region, found {count}')
          path.write_text(updated, encoding='utf-8')

          fixed = path.read_text(encoding='utf-8')
          required = [
              '\n    private static Answer post(AiProviderSettings settings',
              '\n    private static Answer post(\n            AiProviderSettings settings',
              '\n    private static Answer post(\n            ProviderEndpoint endpoint',
              '\n    private static void logProviderFailure(\n',
          ]
          for anchor in required:
              if anchor not in fixed:
                  raise SystemExit(f'missing formatted anchor: {anchor!r}')
          if '\nprivate static Answer post(' in fixed or '\nprivate static void logProviderFailure(' in fixed:
              raise SystemExit('unindented class method remains')
          PY
          git diff --check
      - name: Commit formatting correction
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java
          git commit -m 'style: restore Chat transport indentation'
          git push origin HEAD:agent/m11-phase-c-orchestration-deadline
