# Builds every pushed commit and uploads the Fabric and NeoForge jars as artifacts.
name: build-commit-artifacts

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
      NO_COLOR: 1

    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Extract Minecraft version
        id: versions
        shell: bash
        run: echo "minecraft_version=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Setup Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          validate-wrappers: true

      - name: Build Fabric and NeoForge jars
        run: ./gradlew :fabric:build :neoforge:build --configuration-cache --console=plain --non-interactive

      - name: Upload Fabric jars
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mca-fabric-${{ steps.versions.outputs.minecraft_version }}
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-javadoc.jar
          if-no-files-found: error

      - name: Upload NeoForge jars
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mca-neoforge-${{ steps.versions.outputs.minecraft_version }}
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-javadoc.jar
          if-no-files-found: error
