name: Phase B one-shot metadata patch

on:
  pull_request:
    branches:
      - '1.21.1'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: test/m11-phase-b-production-acceptance
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Apply one-line fix and generate metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('fabric/build.gradle')
          text = path.read_text(encoding='utf-8')
          old = 'installerFiles.single().toPath()'
          new = 'installerFiles[0].toPath()'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          chmod +x gradlew
          ./gradlew \
            :fabric:stageProductionAcceptanceRuntime \
            --write-locks \
            --write-verification-metadata sha256 \
            --no-daemon \
            --console=plain
          test -s fabric/build/production-acceptance/stage/manifest.json

          rm .github/workflows/phase-b-metadata-diagnostic.yml
          rm .github/workflows/phase-b-self-patch.yml

      - name: Verify exact change boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/phase-b-metadata-diagnostic.yml',
              '.github/workflows/phase-b-self-patch.yml',
              'fabric/build.gradle',
              'fabric/gradle.lockfile',
              'gradle/verification-metadata.xml',
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(
                  ['git', 'status', '--short'], text=True
              ).splitlines()
              if line.strip()
          }
          unexpected = sorted(changed - allowed)
          missing = sorted({
              'fabric/build.gradle',
              'fabric/gradle.lockfile',
              'gradle/verification-metadata.xml',
          } - changed)
          if unexpected or missing:
              raise SystemExit(
                  f'unexpected={unexpected}; missing_required={missing}; changed={sorted(changed)}'
              )
          print('Approved one-shot changes:', *sorted(changed), sep='\n- ')
          PY

      - name: Commit generated files and remove temporary workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            fabric/build.gradle \
            fabric/gradle.lockfile \
            gradle/verification-metadata.xml \
            .github/workflows/phase-b-metadata-diagnostic.yml \
            .github/workflows/phase-b-self-patch.yml
          git diff --cached --check
          git commit -m 'build: apply generated Phase B supply-chain metadata'
          git push origin HEAD:test/m11-phase-b-production-acceptance
