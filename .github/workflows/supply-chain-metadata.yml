name: Supply-chain metadata generation

on:
  push:
    branches:
      - 'agent/h3-supply-chain-verification'
    paths:
      - '.github/workflows/supply-chain-metadata.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
      NO_COLOR: '1'

    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true
          validate-wrappers: true

      - name: Generate complete verification metadata and lockfiles
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :fabric:build \
            :neoforge:build \
            dependencyManifest \
            --write-verification-metadata sha256 \
            --write-locks \
            --refresh-dependencies \
            --console=plain \
            --non-interactive

          test -s gradle/verification-metadata.xml
          test -s common/gradle.lockfile
          test -s fabric/gradle.lockfile
          test -s neoforge/gradle.lockfile
          test -s build/reports/dependencies/villaigence-dependencies.txt

      - name: Commit refreshed verification inputs
        if: github.repository == 'True-Ruslan/villAIgence' && github.ref == 'refs/heads/agent/h3-supply-chain-verification'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            gradle/verification-metadata.xml \
            common/gradle.lockfile \
            fabric/gradle.lockfile \
            neoforge/gradle.lockfile
          if git diff --cached --quiet; then
            echo 'Generated verification inputs are already committed.'
            exit 0
          fi
          git commit -m 'build: refresh complete Loom verification inputs'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload generated supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: villaigence-supply-chain-metadata
          path: |
            gradle/verification-metadata.xml
            common/gradle.lockfile
            fabric/gradle.lockfile
            neoforge/gradle.lockfile
            build/reports/dependencies/villaigence-dependencies.txt
          if-no-files-found: error
          retention-days: 7
