name: Supply-chain generated artifact trust bootstrap

on:
  pull_request:
    branches:
      - '1.21.1'
    paths:
      - '.github/workflows/supply-chain-metadata.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'True-Ruslan/villAIgence' && github.event.pull_request.head.repo.full_name == 'True-Ruslan/villAIgence' && github.event.pull_request.head.ref == 'agent/h3-supply-chain-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
      NO_COLOR: '1'

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true
          validate-wrappers: true

      - name: Add narrow trust for locally generated Loom artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('gradle/verification-metadata.xml')
          text = path.read_text(encoding='utf-8')
          marker = '      </trusted-artifacts>\n'
          rules = [
              '         <trust group="^remapped[.].+" file=".*[.]jar" regex="true" reason="Locally remapped Fabric Loom development JARs; source dependencies remain checksum verified"/>\n',
              '         <trust group="net[.]minecraft" name="minecraft-merged-[0-9a-f]+" version="1[.]21[.]1-loom[.]mappings[.].+" file="minecraft-merged-[0-9a-f]+-1[.]21[.]1-loom[.]mappings[.].+[.]jar" regex="true" reason="Locally generated merged Minecraft development JAR; official Minecraft inputs remain checksum verified"/>\n'
          ]
          if marker not in text:
              raise SystemExit('trusted-artifacts closing marker not found')
          for rule in rules:
              if rule.strip() not in text:
                  text = text.replace(marker, rule + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify common tests and both supported platforms
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :common:test \
            :fabric:build \
            :neoforge:build \
            dependencyManifest \
            --refresh-dependencies \
            --console=plain \
            --non-interactive

          test -s build/reports/dependencies/villaigence-dependencies.txt

      - name: Commit reviewed trust policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle/verification-metadata.xml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Reviewed Loom trust policy is already committed.'
            exit 0
          fi
          git commit -m 'build: trust only Loom generated development JARs'
          git push origin "HEAD:agent/h3-supply-chain-verification"
