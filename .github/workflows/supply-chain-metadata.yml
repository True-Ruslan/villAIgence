name: Supply-chain verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '1.21.1'
    paths:
      - '.github/workflows/supply-chain-metadata.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'gradle/verification-metadata.xml'
      - 'buildSrc/**'
      - 'common/build.gradle'
      - 'common/gradle.lockfile'
      - 'fabric/build.gradle'
      - 'fabric/gradle.lockfile'
      - 'neoforge/build.gradle'
      - 'neoforge/gradle.lockfile'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
      NO_COLOR: '1'

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true
          validate-wrappers: true

      - name: Generate checksums, locks and refmap evidence
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :common:test \
            :fabric:build \
            :neoforge:build \
            dependencyManifest \
            --write-verification-metadata sha256 \
            --refresh-dependencies \
            --console=plain \
            --non-interactive

          test -s build/reports/dependencies/refmap-hotfix/verification-metadata.xml
          test -s build/reports/dependencies/refmap-hotfix/fabric.gradle.lockfile
          test -s build/reports/dependencies/refmap-hotfix/mca.refmap.json

      - name: Commit exact generated security state
        shell: bash
        run: |
          set -euo pipefail
          cp build/reports/dependencies/refmap-hotfix/verification-metadata.xml gradle/verification-metadata.xml
          cp build/reports/dependencies/refmap-hotfix/fabric.gradle.lockfile fabric/gradle.lockfile

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml fabric/gradle.lockfile

          if git diff --cached --quiet; then
            echo "Generated security state already committed."
          else
            git commit -m "build: lock Fabric Mixin annotation processor"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Upload generated refmap evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: villaigence-refmap-hotfix-evidence
          path: build/reports/dependencies/refmap-hotfix/**
          if-no-files-found: warn
          retention-days: 7
