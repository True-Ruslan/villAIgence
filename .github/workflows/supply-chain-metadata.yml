name: Supply-chain verification

on:
  pull_request:
    branches:
      - '1.21.1'
    paths:
      - '.github/workflows/supply-chain-metadata.yml'

permissions:
  contents: write

jobs:
  commit-checksums:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}

      - name: Add exact verified Mixin processor checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('gradle/verification-metadata.xml')
          text = path.read_text(encoding='utf-8')
          marker = '      <component group="net.fabricmc" name="mapping-io" version="0.8.0">'
          block = '''      <component group="net.fabricmc" name="fabric-mixin-compile-extensions" version="0.6.0">
                 <artifact name="fabric-mixin-compile-extensions-0.6.0.jar">
                    <sha256 value="23a8ffb25038ba5ddeee30182eb17144e89b9cc5a72c25a9486d0030f9aa4ca6" origin="Generated by Gradle"/>
                 </artifact>
                 <artifact name="fabric-mixin-compile-extensions-0.6.0.module">
                    <sha256 value="86db2801aa4d6d7715064bae0f2bead2184e6880deeb95bfabe4e58bd8e3bcf5" origin="Generated by Gradle"/>
                 </artifact>
              </component>
              <component group="net.fabricmc" name="mapping-io" version="0.2.1">
                 <artifact name="mapping-io-0.2.1.jar">
                    <sha256 value="0f10bf89b161369052ffacfe08ff4edbce91371a89c7967dccfd83b092a39a97" origin="Generated by Gradle"/>
                 </artifact>
                 <artifact name="mapping-io-0.2.1.module">
                    <sha256 value="bb2d78541e61584ca989f4adb74dc47abd03d0c562aa3a9a72ec3007d32bb9ca" origin="Generated by Gradle"/>
                 </artifact>
              </component>
          '''

          if 'name="fabric-mixin-compile-extensions" version="0.6.0"' not in text:
              if marker not in text:
                  raise SystemExit('Could not locate net.fabricmc mapping-io insertion point')
              text = text.replace(marker, block + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Checksums already committed."
          else
            git commit -m "build: verify Fabric Mixin processor artifacts"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
