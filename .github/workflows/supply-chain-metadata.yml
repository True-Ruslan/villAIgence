name: Supply-chain metadata trust bootstrap

on:
  pull_request:
    branches:
      - '1.21.1'
    paths:
      - '.github/workflows/supply-chain-metadata.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'True-Ruslan/villAIgence' && github.event.pull_request.head.repo.full_name == 'True-Ruslan/villAIgence' && github.event.pull_request.head.ref == 'agent/h3-supply-chain-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
      NO_COLOR: '1'

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true
          validate-wrappers: true

      - name: Add narrow trust for locally generated Loom layered mapping JARs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('gradle/verification-metadata.xml')
          text = path.read_text(encoding='utf-8')
          trust = (
              '      <trusted-artifacts>\n'
              '         <trust group="loom" name="mappings" '
              'version="layered[+]hash[.][0-9]+" '
              'file="mappings-layered[+]hash[.][0-9]+[.]jar" regex="true" '
              'reason="Locally generated Fabric Loom layered mappings; external mapping inputs remain checksum verified"/>\n'
              '      </trusted-artifacts>\n'
          )
          marker = '   <configuration>\n'
          if '<trust group="loom" name="mappings"' not in text:
              if marker not in text:
                  raise SystemExit('verification metadata configuration marker not found')
              text = text.replace(marker, marker + trust, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate complete verification metadata and lockfiles
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :fabric:build \
            :neoforge:build \
            dependencyManifest \
            --write-verification-metadata sha256 \
            --write-locks \
            --refresh-dependencies \
            --console=plain \
            --non-interactive

          test -s gradle/verification-metadata.xml
          grep -F '<trust group="loom" name="mappings"' gradle/verification-metadata.xml

      - name: Commit reviewed verification inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            gradle/verification-metadata.xml \
            common/gradle.lockfile \
            fabric/gradle.lockfile \
            neoforge/gradle.lockfile
          if git diff --cached --quiet; then
            echo 'Verification inputs are already current.'
            exit 0
          fi
          git commit -m 'build: trust only generated Loom layered mappings'
          git push origin "HEAD:agent/h3-supply-chain-verification"
