name: One-shot tombstone inventory TDD

on:
  pull_request:
    branches:
      - '1.21.1'
  push:
    branches:
      - 'fix/tombstone-inventory-preservation'

permissions:
  contents: read

jobs:
  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Use Java 21 from runner image
        run: |
          set -euo pipefail
          if [[ -n "${JAVA_HOME_21_X64:-}" && -d "${JAVA_HOME_21_X64}" ]]; then
            export JAVA_HOME="${JAVA_HOME_21_X64}"
            export PATH="${JAVA_HOME}/bin:${PATH}"
            echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
            echo "${JAVA_HOME}/bin" >> "${GITHUB_PATH}"
          fi
          java -version

      - name: Run focused server GameTest boundary
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :fabric:runGameTest \
            --stacktrace \
            --no-daemon \
            --console=plain
