name: One-shot apply tombstone inventory fix

on:
  pull_request:
    branches:
      - '1.21.1'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin fix/tombstone-inventory-preservation
          git checkout -B fix/tombstone-inventory-preservation FETCH_HEAD

      - name: Use Java 21 from runner image
        run: |
          set -euo pipefail
          if [[ -n "${JAVA_HOME_21_X64:-}" && -d "${JAVA_HOME_21_X64}" ]]; then
            export JAVA_HOME="${JAVA_HOME_21_X64}"
            export PATH="${JAVA_HOME}/bin:${PATH}"
            echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
            echo "${JAVA_HOME}/bin" >> "${GITHUB_PATH}"
          fi
          java -version

      - name: Apply minimal ownership transfer fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          relationship_path = Path(
              'common/src/main/java/net/conczin/mca/entity/ai/Relationship.java'
          )
          relationship = relationship_path.read_text(encoding='utf-8')
          start_marker = '    public void onDeath(DamageSource cause) {'
          end_marker = '    public void onTragedy(DamageSource cause, @Nullable BlockPos burialSite) {'
          start = relationship.find(start_marker)
          end = relationship.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Relationship.onDeath method boundaries were not found')

          new_method = indent(dedent('''\
          public boolean onDeath(DamageSource cause) {
              boolean beRemembered = getFamilyEntry().willBeRemembered();
              boolean beLoved = entity.getVillagerBrain().getMemories().values().stream().anyMatch(m -> m.getHearts() > Config.getInstance().heartsRequiredToAutoSpawnGravestone);
              boolean capturedInTombstone = false;

              if (beRemembered || beLoved || !entity.isHostile()) {
                  getFamilyEntry().setDeceased(true);

                  ServerLevel world = (ServerLevel) entity.level();
                  Optional<BlockPos> nearest = GraveyardManager.get(world).findNearest(entity.blockPosition(), GraveyardManager.TombstoneState.EMPTY, 10);

                  if ((beRemembered || beLoved) && nearest.isEmpty()) {
                      nearest = placeTombstone(world, entity.blockPosition());
                  }

                  if (nearest.isPresent()) {
                      BlockPos pos = nearest.get();
                      if (entity.level().getBlockState(pos).is(TagsMCA.Blocks.TOMBSTONES) && entity.level().getBlockEntity(pos) instanceof TombstoneBlock.Data tombstone) {
                          onTragedy(cause, pos);
                          tombstone.setEntity(entity);
                          capturedInTombstone = tombstone.hasEntity();
                      } else {
                          onTragedy(cause, null);
                      }
                  } else {
                      onTragedy(cause, null);
                  }
              } else {
                  onTragedy(cause, null);
              }

              if (!beRemembered) {
                  getFamilyEntry().streamParents().forEach(uuid -> getFamilyTree().remove(uuid));
                  getFamilyTree().remove(entity.getUUID());
              }

              return capturedInTombstone;
          }
          '''), '    ')
          relationship_path.write_text(
              relationship[:start] + new_method + '\n' + relationship[end:],
              encoding='utf-8'
          )

          replace_once(
              'common/src/main/java/net/conczin/mca/entity/VillagerEntityMCA.java',
              '        //drop stuff\n'
              '        InventoryUtils.dropAllItems(this, inventory);\n\n'
              '        //alert family and nearby villagers\n'
              '        relations.onDeath(cause);\n',
              '        // Transfer inventory ownership before any loose death drops are emitted.\n'
              '        boolean capturedInTombstone = relations.onDeath(cause);\n'
              '        if (capturedInTombstone) {\n'
              '            inventory.clearContent();\n'
              '        } else {\n'
              '            InventoryUtils.dropAllItems(this, inventory);\n'
              '        }\n'
          )

          replace_once(
              'common/src/main/java/net/conczin/mca/entity/ZombieVillagerEntityMCA.java',
              '        InventoryUtils.dropAllItems(this, inventory);\n\n'
              '        relations.onDeath(cause);\n',
              '        boolean capturedInTombstone = relations.onDeath(cause);\n'
              '        if (capturedInTombstone) {\n'
              '            inventory.clearContent();\n'
              '        } else {\n'
              '            InventoryUtils.dropAllItems(this, inventory);\n'
              '        }\n'
          )
          PY

      - name: Verify focused and full server boundaries
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :common:test \
            :fabric:runGameTest \
            :fabric:build \
            :neoforge:build \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Commit verified fix and remove one-shot artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-tombstone-inventory-diagnostic.yml
          rm .tombstone-inventory-fix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            common/src/main/java/net/conczin/mca/entity/ai/Relationship.java \
            common/src/main/java/net/conczin/mca/entity/VillagerEntityMCA.java \
            common/src/main/java/net/conczin/mca/entity/ZombieVillagerEntityMCA.java \
            .github/workflows/one-shot-tombstone-inventory-diagnostic.yml \
            .tombstone-inventory-fix-trigger
          git commit -m "fix: preserve inventory through tombstone capture"
          git push origin HEAD:fix/tombstone-inventory-preservation
