name: Ops Patch M11 Water Handoff

on:
  push:
    branches:
      - test/m11-risk-based-acceptance
    paths:
      - .github/workflows/ops-m11-patch-water-handoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: test/m11-risk-based-acceptance
          fetch-depth: 0

      - name: Add bounded stabilization between navigation phases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('fabric/src/gametest/java/net/conczin/mca/gametest/VillAIgenceGameTests.java')
          text = path.read_text(encoding='utf-8')
          old = '''                .thenExecute(() -> helper.assertTrue(
                        startNavigation(villager, landTarget),
                        "NPC must build a post-water dry-land path: "
'''
          new = '''                .thenExecuteAfter(2, () -> helper.assertTrue(
                        startNavigation(villager, landTarget),
                        "NPC must build a post-water dry-land path after stabilization: "
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one post-water handoff, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- fabric/src/gametest/java/net/conczin/mca/gametest/VillAIgenceGameTests.java

      - name: Commit branch patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fabric/src/gametest/java/net/conczin/mca/gametest/VillAIgenceGameTests.java
          git commit -m 'test: stabilize post-water navigation handoff'
          git push origin HEAD:refs/heads/test/m11-risk-based-acceptance
