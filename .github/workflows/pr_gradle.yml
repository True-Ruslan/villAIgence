name: Java Pull Request CI with Gradle

on: [ pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NO_COLOR: 1
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          validate-wrappers: true
      - name: Build with Gradle - NeoForge
        run: ./gradlew :neoforge:build --console=plain --non-interactive
      - name: Build with Gradle - Fabric
        run: ./gradlew :fabric:build --console=plain --non-interactive
