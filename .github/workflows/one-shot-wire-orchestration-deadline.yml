name: One-shot wire orchestration deadline

on:
  push:
    branches:
      - agent/m11-phase-c-orchestration-deadline
    paths:
      - .github/workflows/one-shot-wire-orchestration-deadline.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/m11-phase-c-orchestration-deadline
          fetch-depth: 0

      - name: Wire one deadline through STT Chat and TTS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              source = path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: {label}: expected exactly one anchor, found {count}')
              path.write_text(source.replace(old, new), encoding='utf-8')

          config = Path('common/src/main/java/net/conczin/mca/livingworld/LivingWorldConfig.java')
          replace_once(
              config,
              '''    public int voiceMaxSeconds = 20;
                  public float voiceDistance = 32.0f;

                  public int connectTimeoutSeconds = 10;
          ''',
              '''    public int voiceMaxSeconds = 20;
                  public float voiceDistance = 32.0f;
                  /** Total monotonic budget for one captured voice turn: queueing, STT, Chat and optional TTS. */
                  public int voiceConversationTimeoutSeconds = 120;

                  public int connectTimeoutSeconds = 10;
          ''',
              'voice conversation timeout field'
          )
          replace_once(
              config,
              '''        if (voiceMaxSeconds <= 0) voiceMaxSeconds = 20;
                      if (voiceDistance <= 0) voiceDistance = 32.0f;
                      if (connectTimeoutSeconds <= 0) connectTimeoutSeconds = 10;
          ''',
              '''        if (voiceMaxSeconds <= 0) voiceMaxSeconds = 20;
                      if (voiceDistance <= 0) voiceDistance = 32.0f;
                      if (voiceConversationTimeoutSeconds <= 0) voiceConversationTimeoutSeconds = 120;
                      voiceConversationTimeoutSeconds = Math.max(10, Math.min(300, voiceConversationTimeoutSeconds));
                      if (connectTimeoutSeconds <= 0) connectTimeoutSeconds = 10;
          ''',
              'voice conversation timeout normalization'
          )

          config_test = Path('common/src/test/java/net/conczin/mca/livingworld/LivingWorldConfigTest.java')
          replace_once(
              config_test,
              '''        assertEquals(20, config.voiceMaxSeconds);
                      assertEquals(10, config.connectTimeoutSeconds);
          ''',
              '''        assertEquals(20, config.voiceMaxSeconds);
                      assertEquals(120, config.voiceConversationTimeoutSeconds);
                      assertEquals(10, config.connectTimeoutSeconds);
          ''',
              'default timeout assertion'
          )
          replace_once(
              config_test,
              '''    @Test
                  void providerSpecificEnvironmentKeyWinsOverConfiguredKey() {
          ''',
              '''    @Test
                  void voiceConversationTimeoutDefaultsAndClampsWithoutConfigVersionMigration() {
                      LivingWorldConfig omitted = LivingWorldConfig.parseJson("""
                              {"version":2,"voiceInputEnabled":true}
                              """);
                      assertEquals(120, omitted.voiceConversationTimeoutSeconds);

                      LivingWorldConfig tooSmall = LivingWorldConfig.parseJson("""
                              {"version":2,"voiceConversationTimeoutSeconds":3}
                              """);
                      assertEquals(10, tooSmall.voiceConversationTimeoutSeconds);

                      LivingWorldConfig tooLarge = LivingWorldConfig.parseJson("""
                              {"version":2,"voiceConversationTimeoutSeconds":999}
                              """);
                      assertEquals(300, tooLarge.voiceConversationTimeoutSeconds);

                      LivingWorldConfig invalid = LivingWorldConfig.parseJson("""
                              {"version":2,"voiceConversationTimeoutSeconds":0}
                              """);
                      assertEquals(120, invalid.voiceConversationTimeoutSeconds);
                  }

                  @Test
                  void providerSpecificEnvironmentKeyWinsOverConfiguredKey() {
          ''',
              'timeout normalization test'
          )

          chat_ai = Path('common/src/main/java/net/conczin/mca/entity/ai/chatAI/ChatAI.java')
          replace_once(
              chat_ai,
              'import net.conczin.mca.livingworld.LivingWorldConfig;\n',
              'import net.conczin.mca.livingworld.LivingWorldConfig;\nimport net.conczin.mca.livingworld.ai.AiRequestDeadline;\n',
              'ChatAI deadline import'
          )
          replace_once(
              chat_ai,
              '''    public static Optional<String> answer(
                          MinecraftServer server,
                          ServerPlayer player,
                          VillagerEntityMCA villager,
                          String msg,
                          LivingWorldContextSnapshot snapshot
                  ) {
                      ChatAIStrategy strategy = computeStrategyIfAbsent(snapshot.villagerId());
          ''',
              '''    public static Optional<String> answer(
                          MinecraftServer server,
                          ServerPlayer player,
                          VillagerEntityMCA villager,
                          String msg,
                          LivingWorldContextSnapshot snapshot
                  ) {
                      return answer(server, player, villager, msg, snapshot, null);
                  }

                  public static Optional<String> answer(
                          MinecraftServer server,
                          ServerPlayer player,
                          VillagerEntityMCA villager,
                          String msg,
                          LivingWorldContextSnapshot snapshot,
                          AiRequestDeadline deadline
                  ) {
                      ChatAIStrategy strategy = computeStrategyIfAbsent(snapshot.villagerId());
          ''',
              'ChatAI deadline overload'
          )
          replace_once(
              chat_ai,
              'Optional<String> answer = openAIChatAI.answer(server, player, villager, msg, snapshot);',
              'Optional<String> answer = openAIChatAI.answer(server, player, villager, msg, snapshot, deadline);',
              'ChatAI deadline delegation'
          )

          openai = Path('common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java')
          replace_once(
              openai,
              'import net.conczin.mca.livingworld.ai.AiProviderSettings;\n',
              'import net.conczin.mca.livingworld.ai.AiProviderSettings;\nimport net.conczin.mca.livingworld.ai.AiRequestDeadline;\n',
              'OpenAI deadline import'
          )
          replace_once(
              openai,
              '''                DEFAULT_READ_TIMEOUT_MILLIS,
                              "<unspecified>"
                      );
          ''',
              '''                DEFAULT_READ_TIMEOUT_MILLIS,
                              "<unspecified>",
                              null
                      );
          ''',
              'legacy post deadline'
          )
          replace_once(
              openai,
              '''    private static Answer post(AiProviderSettings settings, String requestBody, String token) {
                      return post(
                              settings.endpoint(),
                              requestBody,
                              token,
                              settings.connectTimeoutMillis(),
                              settings.readTimeoutMillis(),
                              settings.model()
                      );
                  }

                  private static Answer post(
                          ProviderEndpoint endpoint,
                          String requestBody,
                          String token,
                          int connectTimeoutMillis,
                          int readTimeoutMillis,
                          String model
                  ) {
                      ChatCompletionHttpClient.Result result = ChatCompletionHttpClient.post(
                              endpoint,
                              requestBody,
                              token,
                              connectTimeoutMillis,
                              readTimeoutMillis,
                              new ChatCompletionHttpClient.AttemptObserver() {
          ''',
              '''    private static Answer post(AiProviderSettings settings, String requestBody, String token) {
                      return post(settings, requestBody, token, null);
                  }

                  private static Answer post(
                          AiProviderSettings settings,
                          String requestBody,
                          String token,
                          @Nullable AiRequestDeadline deadline
                  ) {
                      return post(
                              settings.endpoint(),
                              requestBody,
                              token,
                              settings.connectTimeoutMillis(),
                              settings.readTimeoutMillis(),
                              settings.model(),
                              deadline
                      );
                  }

                  private static Answer post(
                          ProviderEndpoint endpoint,
                          String requestBody,
                          String token,
                          int connectTimeoutMillis,
                          int readTimeoutMillis,
                          String model,
                          @Nullable AiRequestDeadline deadline
                  ) {
                      ChatCompletionHttpClient.AttemptObserver observer = new ChatCompletionHttpClient.AttemptObserver() {
          ''',
              'OpenAI post overload'
          )
          replace_once(
              openai,
              '''                }
                      );

                      if (result.failure() instanceof BoundedResponseReader.ResponseTooLargeException exception) {
          ''',
              '''                };
                      ChatCompletionHttpClient.Result result = deadline == null
                              ? ChatCompletionHttpClient.post(
                                      endpoint,
                                      requestBody,
                                      token,
                                      connectTimeoutMillis,
                                      readTimeoutMillis,
                                      observer
                              )
                              : ChatCompletionHttpClient.post(
                                      endpoint,
                                      requestBody,
                                      token,
                                      connectTimeoutMillis,
                                      readTimeoutMillis,
                                      deadline,
                                      observer
                              );

                      if (result.failure() instanceof BoundedResponseReader.ResponseTooLargeException exception) {
          ''',
              'OpenAI post invocation'
          )
          replace_once(
              openai,
              '''    public Optional<String> answer(
                          MinecraftServer server,
                          ServerPlayer player,
                          VillagerEntityMCA villager,
                          String msg,
                          LivingWorldContextSnapshot snapshot
                  ) {
                      try {
          ''',
              '''    public Optional<String> answer(
                          MinecraftServer server,
                          ServerPlayer player,
                          VillagerEntityMCA villager,
                          String msg,
                          LivingWorldContextSnapshot snapshot
                  ) {
                      return answer(server, player, villager, msg, snapshot, null);
                  }

                  public Optional<String> answer(
                          MinecraftServer server,
                          ServerPlayer player,
                          VillagerEntityMCA villager,
                          String msg,
                          LivingWorldContextSnapshot snapshot,
                          @Nullable AiRequestDeadline deadline
                  ) {
                      try {
          ''',
              'OpenAI snapshot overload'
          )
          snapshot_start = openai.read_text(encoding='utf-8').index('    public Optional<String> answer(\n            MinecraftServer server,')
          source = openai.read_text(encoding='utf-8')
          token_anchor = '            String token = provider.usePlayerNameAsToken() ? snapshot.playerName() : provider.apiKey();\n            Answer response = post(provider, body.toString(), token);'
          token_index = source.index(token_anchor, snapshot_start)
          source = source[:token_index] + source[token_index:].replace(
              token_anchor,
              '            String token = provider.usePlayerNameAsToken() ? snapshot.playerName() : provider.apiKey();\n            Answer response = post(provider, body.toString(), token, deadline);',
              1
          )
          openai.write_text(source, encoding='utf-8')

          service = Path('fabric/src/main/java/net/conczin/mca/fabric/livingworld/voice/VoiceConversationService.java')
          replace_once(
              service,
              'import net.conczin.mca.livingworld.LivingWorldConfig;\n',
              'import net.conczin.mca.livingworld.LivingWorldConfig;\nimport net.conczin.mca.livingworld.ai.AiRequestDeadline;\n',
              'service deadline import'
          )
          replace_once(
              service,
              '''        MinecraftServer server = optionalServer.get();
                      server.execute(() -> validateTargetAndTranscribe(server, playerId, microphonePcm));
                  }

                  private void validateTargetAndTranscribe(MinecraftServer server, UUID playerId, short[] microphonePcm) {
          ''',
              '''        MinecraftServer server = optionalServer.get();
                      LivingWorldConfig config = LivingWorldConfig.getInstance();
                      AiRequestDeadline deadline = AiRequestDeadline.startTotalMillis(
                              secondsToMillis(config.voiceConversationTimeoutSeconds)
                      );
                      server.execute(() -> validateTargetAndTranscribe(server, playerId, microphonePcm, deadline));
                  }

                  private void validateTargetAndTranscribe(
                          MinecraftServer server,
                          UUID playerId,
                          short[] microphonePcm,
                          AiRequestDeadline deadline
                  ) {
          ''',
              'service deadline creation'
          )
          replace_once(
              service,
              'executor.execute(() -> transcribeAndRoute(server, playerId, targetId, microphonePcm));',
              'executor.execute(() -> transcribeAndRoute(server, playerId, targetId, microphonePcm, deadline));',
              'service STT scheduling'
          )
          replace_once(
              service,
              '''    private void transcribeAndRoute(MinecraftServer server, UUID playerId, UUID targetId, short[] microphonePcm) {
          ''',
              '''    private void transcribeAndRoute(
                          MinecraftServer server,
                          UUID playerId,
                          UUID targetId,
                          short[] microphonePcm,
                          AiRequestDeadline deadline
                  ) {
          ''',
              'service STT signature'
          )
          replace_once(
              service,
              'transcript = audioProvider.transcribe(new PcmAudio(VoiceCaptureManager.VOICECHAT_SAMPLE_RATE, microphonePcm));',
              'transcript = audioProvider.transcribe(\n                    new PcmAudio(VoiceCaptureManager.VOICECHAT_SAMPLE_RATE, microphonePcm),\n                    deadline\n            );',
              'service STT deadline'
          )
          replace_once(
              service,
              'executor.execute(() -> answerAndRespond(server, player, target.get(), snapshot, voiceSnapshot, transcript));',
              'executor.execute(() -> answerAndRespond(\n                    server, player, target.get(), snapshot, voiceSnapshot, transcript, deadline\n            ));',
              'service Chat scheduling'
          )
          replace_once(
              service,
              '''            NpcVoiceSnapshot voiceSnapshot,
                          String transcript
                  ) {
          ''',
              '''            NpcVoiceSnapshot voiceSnapshot,
                          String transcript,
                          AiRequestDeadline deadline
                  ) {
          ''',
              'service answer signature'
          )
          replace_once(
              service,
              'Optional<String> answer = ChatAI.answer(server, player, villager, transcript, snapshot);',
              'Optional<String> answer = ChatAI.answer(server, player, villager, transcript, snapshot, deadline);',
              'service Chat deadline'
          )
          replace_once(
              service,
              'speech = audioProvider.synthesize(new TtsRequest(text, profile.voiceId(), style))',
              'speech = audioProvider.synthesize(new TtsRequest(text, profile.voiceId(), style), deadline)',
              'service TTS deadline'
          )
          replace_once(
              service,
              '''    private void release(UUID playerId, UUID villagerId) {
          ''',
              '''    private static int secondsToMillis(int seconds) {
                      long value = Math.max(1L, seconds) * 1_000L;
                      return (int) Math.min(Integer.MAX_VALUE, value);
                  }

                  private void release(UUID playerId, UUID villagerId) {
          ''',
              'service timeout conversion'
          )
          PY

          cat > common/src/test/java/net/conczin/mca/security/VoiceConversationDeadlineWiringPolicyTest.java <<'JAVA'
          package net.conczin.mca.security;

          import org.junit.jupiter.api.Test;

          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;

          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          class VoiceConversationDeadlineWiringPolicyTest {
              @Test
              void oneDeadlineIsCreatedOnceAndPassedThroughEveryVoiceProviderStage() throws IOException {
                  Path root = Path.of("..").toAbsolutePath().normalize();
                  String service = Files.readString(root.resolve(
                          "fabric/src/main/java/net/conczin/mca/fabric/livingworld/voice/VoiceConversationService.java"
                  ));

                  assertEquals(
                          1L,
                          service.lines().filter(line -> line.contains("AiRequestDeadline.startTotalMillis(")).count(),
                          "One voice turn must create exactly one total deadline"
                  );
                  assertTrue(service.contains("audioProvider.transcribe(\n                    new PcmAudio"));
                  assertTrue(service.contains("microphonePcm),\n                    deadline"));
                  assertTrue(service.contains("ChatAI.answer(server, player, villager, transcript, snapshot, deadline)"));
                  assertTrue(service.contains("audioProvider.synthesize(new TtsRequest(text, profile.voiceId(), style), deadline)"));
              }

              @Test
              void snapshotChatPathDelegatesTheSameDeadlineWithoutMovingCommitIntoRetryLoop() throws IOException {
                  Path root = Path.of("..").toAbsolutePath().normalize();
                  String chatAi = Files.readString(root.resolve(
                          "common/src/main/java/net/conczin/mca/entity/ai/chatAI/ChatAI.java"
                  ));
                  String openAi = Files.readString(root.resolve(
                          "common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java"
                  ));
                  String transport = Files.readString(root.resolve(
                          "common/src/main/java/net/conczin/mca/livingworld/ai/ChatCompletionHttpClient.java"
                  ));

                  assertTrue(chatAi.contains("openAIChatAI.answer(server, player, villager, msg, snapshot, deadline)"));
                  assertTrue(openAi.contains("post(provider, body.toString(), token, deadline)"));
                  assertTrue(transport.contains("AiRequestDeadline deadline,\n            AttemptObserver observer"));
                  assertEquals(
                          1L,
                          openAi.lines().filter(line -> line.contains("applySnapshotRelationshipDelta(")).count(),
                          "Relationship mutation must remain one post-provider commit site"
                  );
              }
          }
          JAVA

          grep -Fq 'voiceConversationTimeoutSeconds = 120' common/src/main/java/net/conczin/mca/livingworld/LivingWorldConfig.java
          grep -Fq 'ChatAI.answer(server, player, villager, transcript, snapshot, deadline)' fabric/src/main/java/net/conczin/mca/fabric/livingworld/voice/VoiceConversationService.java
          grep -Fq 'post(provider, body.toString(), token, deadline)' common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java
          git diff --check

      - name: Commit orchestration wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            common/src/main/java/net/conczin/mca/livingworld/LivingWorldConfig.java \
            common/src/test/java/net/conczin/mca/livingworld/LivingWorldConfigTest.java \
            common/src/main/java/net/conczin/mca/entity/ai/chatAI/ChatAI.java \
            common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java \
            fabric/src/main/java/net/conczin/mca/fabric/livingworld/voice/VoiceConversationService.java \
            common/src/test/java/net/conczin/mca/security/VoiceConversationDeadlineWiringPolicyTest.java
          git commit -m 'feat: enforce one deadline across voice conversation stages'
          git push origin HEAD:agent/m11-phase-c-orchestration-deadline
