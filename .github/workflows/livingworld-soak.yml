name: VillAIgence Production Soak

on:
  schedule:
    - cron: '43 3 * * 1'
  pull_request:
    branches:
      - '1.21.1'
    paths:
      - '.github/workflows/livingworld-soak.yml'
      - 'build.gradle'
      - 'common/src/main/java/net/conczin/mca/livingworld/**'
      - 'common/src/main/java/net/conczin/mca/network/**'
      - 'common/src/test/java/net/conczin/mca/livingworld/**'
      - 'common/src/test/java/net/conczin/mca/network/**'
      - 'fabric/build.gradle'
      - 'fabric/production-acceptance-fixture.gradle'
      - 'fabric/src/productionAcceptanceFixture/**'
      - 'scripts/ci/production_lifecycle_acceptance.py'
      - 'scripts/ci/production_server_acceptance.py'
      - 'scripts/ci/production_server_acceptance_strict.py'
      - 'scripts/ci/production_soak_acceptance.py'
      - 'scripts/ci/test_production_soak_acceptance.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: villaigence-production-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
      NO_COLOR: "1"

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true

      - name: Run soak contracts and repository policy
        run: |
          set -euo pipefail
          python3 scripts/ci/test_production_soak_acceptance.py
          python3 scripts/ci/test_select_acceptance_suites.py
          python3 scripts/ci/repository_security_policy.py --check
          test -s build/security/script-inventory.json

      - name: Repeat authenticated concurrency scenarios under constrained heap
        run: |
          set -euo pipefail
          chmod +x gradlew
          for iteration in 1 2 3; do
            echo "Concurrency soak iteration ${iteration}/3"
            ./gradlew \
              :common:test \
              --tests '*AuthenticatedTextTurnAcceptanceTest' \
              --tests '*OperatorLoreNetworkSessionAcceptanceTest' \
              --rerun-tasks \
              -Pfork_max_heap=512M \
              --max-workers=2 \
              --stacktrace \
              --no-daemon \
              --console=plain
          done

      - name: Stage exact production runtime under constrained fork heap
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :fabric:stageProductionAcceptanceRuntime \
            -Pfork_max_heap=512M \
            --max-workers=2 \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Execute five-cycle production restart soak
        run: |
          set -euo pipefail
          rm -rf build/production-soak
          mkdir -p build/production-soak/evidence
          python3 scripts/ci/production_soak_acceptance.py \
            --stage-dir fabric/build/production-acceptance/stage \
            --execute \
            --cycles 5 \
            --work-dir build/production-soak/work \
            --report-dir build/production-soak/evidence \
            --java "${JAVA_HOME}/bin/java" \
            --installer-timeout-seconds 300 \
            --startup-timeout-seconds 240 \
            --shutdown-timeout-seconds 60 \
            --max-heap-mib 512

          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path(
              'build/production-soak/evidence/production-soak-report.json'
          )
          report = json.loads(report_path.read_text(encoding='utf-8'))
          cycles = report.get('cycleResults')
          if report.get('status') != 'PASS':
              raise SystemExit('production soak report is not PASS')
          if report.get('cycles') != 5 or report.get('maxHeapMiB') != 512:
              raise SystemExit('production soak bounds changed')
          if not isinstance(cycles, list) or len(cycles) != 5:
              raise SystemExit('production soak must contain five cycle results')
          for index, cycle in enumerate(cycles, start=1):
              if cycle.get('cycle') != index:
                  raise SystemExit('production soak cycle numbering changed')
              if cycle.get('exitCode') != 0:
                  raise SystemExit(f'cycle {index} did not exit cleanly')
              if cycle.get('ready') is not True or cycle.get('stopSent') is not True:
                  raise SystemExit(f'cycle {index} did not reach bounded ready/stop')
              expected_phase = 'CREATED' if index == 1 else 'RESTART_VERIFIED'
              if cycle.get('lifecyclePhase') != expected_phase:
                  raise SystemExit(f'cycle {index} lifecycle phase changed')
              if cycle.get('liveEntityCount') != 1:
                  raise SystemExit(f'cycle {index} duplicated lifecycle identity')
              if cycle.get('voiceStatus') != 'PASS':
                  raise SystemExit(f'cycle {index} voice transport is not PASS')
          PY

      - name: Upload production soak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-soak-${{ github.run_number }}
          path: build/production-soak/evidence
          if-no-files-found: error
          retention-days: 30
