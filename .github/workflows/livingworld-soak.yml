name: VillAIgence Production Soak

on:
  pull_request:
    branches:
      - '1.21.1'
    paths:
      - '.github/workflows/livingworld-soak.yml'
      - 'build.gradle'
      - 'scripts/ci/production_soak_acceptance.py'
      - 'scripts/ci/test_production_soak_acceptance.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: villaigence-production-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Run production soak contract tests
        run: python3 scripts/ci/test_production_soak_acceptance.py
