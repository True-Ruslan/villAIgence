name: M11 Focused Fabric GameTest

on:
  push:
    branches:
      - test/m11-risk-based-acceptance
    paths:
      - fabric/build.gradle
      - fabric/src/gametest/**
      - .github/workflows/ops-m11-focused-gametest.yml

permissions:
  contents: read

concurrency:
  group: m11-focused-gametest
  cancel-in-progress: true

jobs:
  gametest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Use Java 21 from runner image
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${JAVA_HOME_21_X64:-}" && -d "${JAVA_HOME_21_X64}" ]]; then
            echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "${GITHUB_ENV}"
            echo "${JAVA_HOME_21_X64}/bin" >> "${GITHUB_PATH}"
          fi
          java -version

      - name: Run isolated Fabric server GameTests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :fabric:runGameTest --stacktrace --no-daemon --console=plain
