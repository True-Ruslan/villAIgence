name: Publish and verify isolated 0.1.20 release

on:
  pull_request:
    branches:
      - '1.21.1'
    paths:
      - '.github/workflows/ops-create-0.1.20-tag.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-villaigence-0.1.20
  cancel-in-progress: false

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: 0.1.20+1.21.1
      EXPECTED_SHA: 3244bc98fb6d2f8e1b7a3c7715ca0c35970a58f9
    steps:
      - name: Checkout operation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create exact canonical release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/1.21.1:refs/remotes/origin/1.21.1 --tags
          canonical_sha="$(git rev-parse refs/remotes/origin/1.21.1)"
          test "${canonical_sha}" = "${EXPECTED_SHA}"

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error title=Release tag already exists::${RELEASE_TAG}"
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error title=GitHub Release already exists::${RELEASE_TAG}"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${RELEASE_TAG}" "${EXPECTED_SHA}" \
            -m "VillAIgence ${RELEASE_TAG}: tombstone startup hotfix"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Wait for official GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if gh release view "${RELEASE_TAG}" \
              --json tagName,url,isDraft,isPrerelease,publishedAt,targetCommitish,assets \
              > release.json 2>/dev/null; then
              cat release.json
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Release was not published::${RELEASE_TAG}"
          exit 1

      - name: Download and verify official assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/1.21.1:refs/remotes/origin/1.21.1 --tags
          tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          canonical_sha="$(git rev-parse refs/remotes/origin/1.21.1)"
          test "${tag_sha}" = "${EXPECTED_SHA}"
          test "${canonical_sha}" = "${EXPECTED_SHA}"

          mkdir -p official-assets
          gh release download "${RELEASE_TAG}" --dir official-assets

          mapfile -t jars < <(find official-assets -maxdepth 1 -type f -name '*.jar' | sort)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            printf 'Expected exactly one official JAR, found %s:\n%s\n' \
              "${#jars[@]}" "${jars[*]:-<none>}"
            exit 1
          fi
          jar_file="${jars[0]}"
          checksum_file="${jar_file}.sha256"
          test -s "${checksum_file}"

          actual_sha="$(sha256sum "${jar_file}" | awk '{print $1}')"
          declared_sha="$(awk '{print $1}' "${checksum_file}")"
          test "${actual_sha}" = "${declared_sha}"

          mapfile -t dependency_files < <(
            find official-assets -maxdepth 1 -type f -name 'villaigence-dependencies-*.txt' | sort
          )
          test "${#dependency_files[@]}" -eq 1
          test -s "${dependency_files[0]}"

          python - "${jar_file}" <<'PY'
          import hashlib
          import json
          import sys
          import zipfile

          jar_path = sys.argv[1]
          expected_jump = "Lnet/minecraft/class_1309;method_6100(Z)V"
          tombstone_class = "net/conczin/mca/block/TombstoneBlock$Data.class"
          removed_mixin_class = "net/conczin/mca/mixin/MixinTombstoneData.class"

          with zipfile.ZipFile(jar_path) as jar:
              names = set(jar.namelist())
              required = {"mca.mixins.json", "mca.refmap.json", tombstone_class}
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"missing required JAR entries: {missing}")

              mixin_config = json.loads(jar.read("mca.mixins.json"))
              if mixin_config.get("refmap") != "mca.refmap.json":
                  raise SystemExit(f"unexpected refmap declaration: {mixin_config.get('refmap')!r}")
              if "MixinTombstoneData" in mixin_config.get("mixins", []):
                  raise SystemExit("MixinTombstoneData is still registered")
              if removed_mixin_class in names:
                  raise SystemExit("MixinTombstoneData.class is still packaged")

              refmap_bytes = jar.read("mca.refmap.json")
              refmap = json.loads(refmap_bytes)
              mappings = refmap.get("mappings", {})
              living = mappings.get("net/conczin/mca/mixin/MixinLivingEntity", {})
              mob = mappings.get("net/conczin/mca/mixin/MixinMob", {})
              if living.get("setJumping") != expected_jump:
                  raise SystemExit(f"unexpected LivingEntity setJumping mapping: {living.get('setJumping')!r}")
              if "setJumping" in mob:
                  raise SystemExit(f"MixinMob still maps setJumping: {mob['setJumping']!r}")

              tombstone_bytes = jar.read(tombstone_class)
              for marker in (
                  b"net/conczin/mca/entity/ai/brain/tasks/MourningMemoryLifecycle",
                  b"clearAfterResurrection",
              ):
                  if marker not in tombstone_bytes:
                      raise SystemExit(f"missing direct tombstone cleanup marker: {marker!r}")

              print(f"official_jar={jar_path}")
              print(f"official_jar_sha256={hashlib.sha256(open(jar_path, 'rb').read()).hexdigest()}")
              print(f"embedded_refmap_sha256={hashlib.sha256(refmap_bytes).hexdigest()}")
              print(f"setJumping={living['setJumping']}")
              print("MixinTombstoneData=absent")
              print("directMourningCleanup=present")
          PY

      - name: Upload official release verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: villaigence-0.1.20-official-release-evidence
          path: |
            release.json
            official-assets/*
          if-no-files-found: error
          retention-days: 30
