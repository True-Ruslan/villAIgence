name: Phase B apply fixture build script

on:
  pull_request:
    branches:
      - '1.21.1'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: test/m11-phase-b-production-acceptance
          fetch-depth: 1

      - name: Apply exact build-script reference
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('fabric/build.gradle')
          text = path.read_text(encoding='utf-8')
          line = "apply from: 'production-acceptance-fixture.gradle'\n"
          if line in text:
              raise SystemExit('fixture build script is already applied')
          path.write_text(text.rstrip() + '\n\n' + line, encoding='utf-8')
          PY
          rm .github/workflows/phase-b-store-diagnostic.yml
          rm .github/workflows/phase-b-apply-fixture.yml

      - name: Verify exact change boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/phase-b-apply-fixture.yml',
              '.github/workflows/phase-b-store-diagnostic.yml',
              'fabric/build.gradle',
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
              if line.strip()
          }
          if changed != allowed:
              raise SystemExit(f'expected {sorted(allowed)}, found {sorted(changed)}')
          PY

      - name: Commit and push patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            fabric/build.gradle \
            .github/workflows/phase-b-store-diagnostic.yml \
            .github/workflows/phase-b-apply-fixture.yml
          git diff --cached --check
          git commit -m 'build: apply isolated production acceptance fixture'
          git push origin HEAD:test/m11-phase-b-production-acceptance
