name: Verify isolated 0.1.19 release

on:
  pull_request:
    branches:
      - '1.21.1'
    paths:
      - '.github/workflows/ops-create-0.1.19-tag.yml'

permissions:
  contents: read

concurrency:
  group: verify-villaigence-0.1.19-release
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: 0.1.19+1.21.1
      EXPECTED_SHA: 5a6765223b8f3e3c52715fb506d65bc0dafe9fa7
    steps:
      - name: Checkout operation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Wait for official GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if gh release view "${RELEASE_TAG}" --json tagName,url,isDraft,isPrerelease,publishedAt,targetCommitish,assets > release.json 2>/dev/null; then
              cat release.json
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Release was not published::${RELEASE_TAG}"
          exit 1

      - name: Verify tag and official assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/1.21.1:refs/remotes/origin/1.21.1 --tags
          tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          canonical_sha="$(git rev-parse refs/remotes/origin/1.21.1)"

          test "${tag_sha}" = "${EXPECTED_SHA}"
          test "${canonical_sha}" = "${EXPECTED_SHA}"

          mkdir -p release-assets
          gh release download "${RELEASE_TAG}" --dir release-assets

          mapfile -t jars < <(find release-assets -maxdepth 1 -type f -name '*.jar' | sort)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            printf 'Expected exactly one JAR, found %s:\n%s\n' "${#jars[@]}" "${jars[*]:-<none>}"
            exit 1
          fi
          jar_file="${jars[0]}"
          checksum_file="${jar_file}.sha256"
          test -s "${checksum_file}"

          actual_sha="$(sha256sum "${jar_file}" | awk '{print $1}')"
          declared_sha="$(awk '{print $1}' "${checksum_file}")"
          test "${actual_sha}" = "${declared_sha}"

          python - "${jar_file}" <<'PY'
          import hashlib
          import json
          import sys
          import zipfile

          jar_path = sys.argv[1]
          expected_target = "Lnet/minecraft/class_1309;method_6100(Z)V"

          with zipfile.ZipFile(jar_path) as jar:
              names = set(jar.namelist())
              required = {"mca.mixins.json", "mca.refmap.json"}
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"missing required JAR entries: {missing}")

              mixin_config = json.loads(jar.read("mca.mixins.json"))
              if mixin_config.get("refmap") != "mca.refmap.json":
                  raise SystemExit(f"unexpected refmap declaration: {mixin_config.get('refmap')!r}")

              refmap_bytes = jar.read("mca.refmap.json")
              refmap = json.loads(refmap_bytes)
              mappings = refmap.get("mappings", {})
              living = mappings.get("net/conczin/mca/mixin/MixinLivingEntity", {})
              mob = mappings.get("net/conczin/mca/mixin/MixinMob", {})

              if living.get("setJumping") != expected_target:
                  raise SystemExit(f"unexpected LivingEntity setJumping mapping: {living.get('setJumping')!r}")
              if "setJumping" in mob:
                  raise SystemExit(f"MixinMob still contains setJumping mapping: {mob['setJumping']!r}")

              print(f"official_jar={jar_path}")
              print(f"official_jar_sha256={hashlib.sha256(open(jar_path, 'rb').read()).hexdigest()}")
              print(f"embedded_refmap_sha256={hashlib.sha256(refmap_bytes).hexdigest()}")
              print(f"setJumping={living['setJumping']}")
          PY
