name: LivingWorld GitHub Release

on:
  push:
    tags:
      - '**'
  pull_request:
    branches:
      - '1.21.1'
    paths:
      - '.github/workflows/livingworld-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livingworld-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  startup-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow startup
        run: echo "LivingWorld release workflow startup is valid"
