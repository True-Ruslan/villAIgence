name: VillAIgence GitHub Release

on:
  push:
    tags:
      - '**'
    branches:
      - '1.21.1'
    paths:
      - 'docs/releases/NEXT_RELEASE.txt'
  pull_request:
    branches:
      - '1.21.1'
    paths:
      - '.github/workflows/livingworld-release.yml'
      - '.github/workflows/livingworld-nightly.yml'
      - '.github/workflows/livingworld-soak.yml'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradle/verification-metadata.xml'
      - '**/gradle.lockfile'
      - 'common/src/main/java/net/conczin/mca/livingworld/**'
      - 'common/src/test/java/net/conczin/mca/livingworld/**'
      - 'docs/RELEASING.md'
      - 'docs/releases/**'
      - 'docs/livingworld/VALIDATION_0.1.24_RELEASE_GATE.md'
      - 'docs/livingworld/VALIDATION_0.1.25_RELEASE_GATE.md'
      - 'fabric/build.gradle'
      - 'fabric/production-acceptance-fixture.gradle'
      - 'fabric/src/productionAcceptanceFixture/**'
      - 'scripts/ci/package-livingworld-release.sh'
      - 'scripts/ci/persistence_recovery_acceptance.py'
      - 'scripts/ci/production_lifecycle_acceptance.py'
      - 'scripts/ci/production_server_acceptance.py'
      - 'scripts/ci/production_server_acceptance_strict.py'
      - 'scripts/ci/production_soak_acceptance.py'
      - 'scripts/ci/select_acceptance_suites.py'
      - 'scripts/ci/test_persistence_recovery_acceptance.py'
      - 'scripts/ci/test_production_lifecycle_acceptance.py'
      - 'scripts/ci/test_production_server_acceptance.py'
      - 'scripts/ci/test_production_server_process.py'
      - 'scripts/ci/test_production_soak_acceptance.py'
      - 'scripts/ci/test_select_acceptance_suites.py'
      - 'scripts/ci/test-release-version-contract.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: villaigence-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      release_tag: ${{ steps.release-meta.outputs.release_tag }}
      release_mode: ${{ steps.release-meta.outputs.release_mode }}
      publish_release: ${{ steps.release-meta.outputs.publish_release }}
    env:
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
      NO_COLOR: "1"
    steps:
      - name: Checkout commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve and verify release metadata
        id: release-meta
        shell: bash
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          request_file='docs/releases/NEXT_RELEASE.txt'
          release_tag=''
          release_mode='dry-run'
          publish_release='false'

          if [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            release_tag="${GITHUB_REF_NAME}"
            release_mode='tag'
            publish_release='true'
          elif [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'branch' ]]; then
            if [[ "${GITHUB_REF_NAME}" != '1.21.1' ]]; then
              echo "::error title=Invalid release branch::Release requests may run only from 1.21.1."
              exit 1
            fi
            if [[ -n "${PUSH_BEFORE_SHA:-}" \
                  && "${PUSH_BEFORE_SHA}" != '0000000000000000000000000000000000000000' ]]; then
              if ! git diff --quiet "${PUSH_BEFORE_SHA}" HEAD -- "${request_file}"; then
                test -s "${request_file}"
                release_tag="$(sed -e 's/\r$//' -e '/^[[:space:]]*$/d' "${request_file}")"
                release_mode='request'
                publish_release='true'
              fi
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == 'pull_request' ]]; then
            git fetch origin \
              "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            if ! git diff --quiet \
                "refs/remotes/origin/${GITHUB_BASE_REF}" \
                HEAD \
                -- "${request_file}"; then
              test -s "${request_file}"
              release_tag="$(sed -e 's/\r$//' -e '/^[[:space:]]*$/d' "${request_file}")"
              release_mode='request-validation'
            fi
          fi

          if [[ "${release_tag}" == *$'\n'* || "${release_tag}" =~ [[:space:]] ]]; then
            echo "::error title=Invalid release request::NEXT_RELEASE.txt must contain exactly one tag and no whitespace."
            exit 1
          fi

          if [[ -n "${release_tag}" ]]; then
            tag_pattern='^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?[+][0-9]+([.][0-9]+){1,2}$'
            if [[ ! "${release_tag}" =~ ${tag_pattern} ]]; then
              echo "::error title=Invalid release tag::Expected '<mod_version>+<minecraft_version>', for example '0.1.25+1.21.1'."
              exit 1
            fi

            minecraft_version="${release_tag#*+}"
            configured_minecraft_version="$(grep '^minecraft_version=' gradle.properties | head -n 1 | cut -d= -f2-)"
            if [[ "${minecraft_version}" != "${configured_minecraft_version}" ]]; then
              echo "::error title=Minecraft version mismatch::Tag declares ${minecraft_version}, but gradle.properties declares ${configured_minecraft_version}."
              exit 1
            fi

            git fetch origin refs/heads/1.21.1:refs/remotes/origin/1.21.1
            git fetch --tags origin
            current_sha="$(git rev-parse HEAD)"
            branch_sha="$(git rev-parse refs/remotes/origin/1.21.1)"

            remote_tag_sha="$(git ls-remote --tags origin "refs/tags/${release_tag}^{}" | awk 'NR == 1 {print $1}')"
            if [[ -z "${remote_tag_sha}" ]]; then
              remote_tag_sha="$(git ls-remote --tags origin "refs/tags/${release_tag}" | awk 'NR == 1 {print $1}')"
            fi

            case "${release_mode}" in
              tag)
                if [[ "${current_sha}" != "${branch_sha}" ]]; then
                  echo "::error title=Release tag is not on current 1.21.1 head::Tag commit ${current_sha} differs from 1.21.1 ${branch_sha}."
                  exit 1
                fi
                mapfile -t head_tags < <(git tag --points-at HEAD | sort)
                if [[ "${#head_tags[@]}" -ne 1 || "${head_tags[0]}" != "${release_tag}" ]]; then
                  echo "::error title=Ambiguous release version::Exactly one tag must point at the release commit and it must be ${release_tag}."
                  printf 'Tags at HEAD:\n%s\n' "${head_tags[*]:-<none>}"
                  exit 1
                fi
                ;;
              request)
                if [[ "${current_sha}" != "${branch_sha}" ]]; then
                  echo "::error title=Release request is not current 1.21.1 head::Request commit ${current_sha} differs from 1.21.1 ${branch_sha}."
                  exit 1
                fi
                if [[ -n "${remote_tag_sha}" && "${remote_tag_sha}" != "${current_sha}" ]]; then
                  echo "::error title=Release tag already consumed::${release_tag} points to ${remote_tag_sha}, not ${current_sha}."
                  exit 1
                fi
                ;;
              request-validation)
                if [[ -n "${remote_tag_sha}" ]]; then
                  echo "::error title=Release tag already exists::${release_tag} is already published or reserved at ${remote_tag_sha}."
                  exit 1
                fi
                ;;
            esac

            echo "RELEASE_VERSION=${release_tag}" >> "${GITHUB_ENV}"
          fi

          echo "PUBLISH_RELEASE=${publish_release}" >> "${GITHUB_ENV}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_mode=${release_mode}" >> "${GITHUB_OUTPUT}"
          echo "publish_release=${publish_release}" >> "${GITHUB_OUTPUT}"

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true

      - name: Select complete release acceptance suite
        id: acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/acceptance-selection
          : > build/acceptance-selection/changed-paths.txt
          python3 scripts/ci/select_acceptance_suites.py \
            --mode release \
            --changed-paths-file build/acceptance-selection/changed-paths.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: Require complete release acceptance suite
        shell: bash
        run: test "${{ steps.acceptance.outputs.all }}" = 'true'

      - name: Verify exact release identity contract
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/ci/test-release-version-contract.sh
          scripts/ci/test-release-version-contract.sh

      - name: Run repository security policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/repository_security_policy.py --check
          test -s build/security/script-inventory.json

      - name: Run production acceptance contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/test_select_acceptance_suites.py
          python3 scripts/ci/test_production_server_acceptance.py
          python3 scripts/ci/test_production_server_process.py
          python3 scripts/ci/test_production_lifecycle_acceptance.py
          python3 scripts/ci/test_persistence_recovery_acceptance.py
          python3 scripts/ci/test_production_soak_acceptance.py

      - name: Stage and execute exact production server acceptance
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          gradle_args=(
            :fabric:stageProductionAcceptanceRuntime
            --stacktrace
            --no-daemon
            --console=plain
          )
          if [[ -n "${RELEASE_VERSION:-}" ]]; then
            gradle_args+=("-Prelease_version=${RELEASE_VERSION}")
          fi
          ./gradlew "${gradle_args[@]}"

          rm -rf build/production-server-acceptance
          mkdir -p build/production-server-acceptance/evidence
          python3 scripts/ci/production_server_acceptance_strict.py \
            --stage-dir fabric/build/production-acceptance/stage \
            --execute \
            --work-dir build/production-server-acceptance/work \
            --report-dir build/production-server-acceptance/evidence \
            --java "${JAVA_HOME}/bin/java" \
            --installer-timeout-seconds 300 \
            --startup-timeout-seconds 240 \
            --shutdown-timeout-seconds 60 \
            --max-heap-mib 768

          grep -Fq 'VILLAIGENCE_PRODUCTION_FIXTURE_READY' \
            build/production-server-acceptance/evidence/server-run-1.log
          grep -Fq 'VILLAIGENCE_PRODUCTION_FIXTURE_READY' \
            build/production-server-acceptance/evidence/server-run-2.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('build/production-server-acceptance/evidence/acceptance-report.json')
              .read_text(encoding='utf-8')
          )
          if report.get('status') != 'PASS':
              raise SystemExit('production acceptance report is not PASS')
          PY

          python3 scripts/ci/production_lifecycle_acceptance.py \
            --server-root build/production-server-acceptance/work/server \
            --report build/production-server-acceptance/evidence/lifecycle-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('build/production-server-acceptance/evidence/lifecycle-report.json')
              .read_text(encoding='utf-8')
          )
          if report.get('status') != 'PASS':
              raise SystemExit('production lifecycle report is not PASS')
          PY

      - name: Upload production acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-server-acceptance-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: build/production-server-acceptance/evidence

      - name: Execute exact persistence recovery matrix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/persistence-recovery-acceptance
          mkdir -p build/persistence-recovery-acceptance/evidence
          python3 scripts/ci/persistence_recovery_acceptance.py \
            --stage-dir fabric/build/production-acceptance/stage \
            --execute \
            --work-dir build/persistence-recovery-acceptance/work \
            --report-dir build/persistence-recovery-acceptance/evidence \
            --java "${JAVA_HOME}/bin/java" \
            --installer-timeout-seconds 300 \
            --startup-timeout-seconds 180 \
            --shutdown-timeout-seconds 60 \
            --max-heap-mib 768
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('build/persistence-recovery-acceptance/evidence/persistence-recovery-report.json')
              .read_text(encoding='utf-8')
          )
          if report.get('status') != 'PASS':
              raise SystemExit('persistence recovery report is not PASS')
          cases = report.get('cases')
          if not isinstance(cases, list) or len(cases) != 5:
              raise SystemExit('persistence recovery report must contain five cases')
          if any(case.get('status') != 'PASS' for case in cases):
              raise SystemExit('at least one persistence recovery case is not PASS')
          PY

      - name: Upload persistence recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: persistence-recovery-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: build/persistence-recovery-acceptance/evidence

      - name: Run risk catalog, server GameTests and supported loader builds
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          gradle_args=(
            :common:test
            :fabric:runGameTest
            :fabric:build
            :neoforge:build
            dependencyManifest
            --stacktrace
            --no-daemon
            --console=plain
          )
          if [[ -n "${RELEASE_VERSION:-}" ]]; then
            gradle_args+=("-Prelease_version=${RELEASE_VERSION}")
          fi
          ./gradlew "${gradle_args[@]}"
          test -s build/reports/dependencies/villaigence-dependencies.txt

      - name: Package and smoke-check VillAIgence artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/ci/package-livingworld-release.sh
          if [[ "${PUBLISH_RELEASE}" == 'true' ]]; then
            artifact_label="${RELEASE_VERSION}"
            is_release=true
          else
            artifact_label="dry-run-${GITHUB_RUN_NUMBER}"
            is_release=false
          fi
          scripts/ci/package-livingworld-release.sh "${artifact_label}" "${is_release}" dist
          manifest_file="dist/villaigence-dependencies-${artifact_label}.txt"
          cp build/reports/dependencies/villaigence-dependencies.txt "${manifest_file}"
          echo "manifest=${manifest_file}" >> "$GITHUB_OUTPUT"

      - name: Verify the production-accepted JAR is the packaged JAR
        shell: bash
        run: |
          set -euo pipefail
          accepted_jar="fabric/build/production-acceptance/stage/mods/villaigence-under-test.jar"
          packaged_jar="${{ steps.package.outputs.jar }}"
          test -s "${accepted_jar}"
          test -s "${packaged_jar}"
          if ! cmp -s "${accepted_jar}" "${packaged_jar}"; then
            echo "::error title=Release artifact identity mismatch::The JAR exercised by production acceptance differs from the packaged release JAR."
            sha256sum "${accepted_jar}" "${packaged_jar}"
            exit 1
          fi
          sha256sum "${accepted_jar}" "${packaged_jar}"

      - name: Upload verified VillAIgence Fabric package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: villaigence-fabric-package
          path: |
            ${{ steps.package.outputs.jar }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.manifest }}
          if-no-files-found: error
          retention-days: 30

  github-release:
    needs: build-and-package
    if: needs.build-and-package.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}

      - name: Download verified VillAIgence release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: villaigence-fabric-package
          path: dist

      - name: Ensure immutable release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.build-and-package.outputs.release_tag }}
          RELEASE_MODE: ${{ needs.build-and-package.outputs.release_mode }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_TAG}"
          git fetch --tags origin

          existing_sha=''
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            existing_sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          fi

          if [[ -n "${existing_sha}" ]]; then
            if [[ "${existing_sha}" != "${GITHUB_SHA}" ]]; then
              echo "::error title=Release tag points elsewhere::${RELEASE_TAG} points to ${existing_sha}, not ${GITHUB_SHA}."
              exit 1
            fi
          elif [[ "${RELEASE_MODE}" == 'request' ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" \
              -m "VillAIgence ${RELEASE_TAG%%+*} for Minecraft ${RELEASE_TAG#*+}"
            git push origin "refs/tags/${RELEASE_TAG}"
          else
            echo "::error title=Missing release tag::Tag-triggered release ${RELEASE_TAG} is not available locally."
            exit 1
          fi

      - name: Create or update VillAIgence GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-and-package.outputs.release_tag }}
        run: |
          set -euo pipefail

          release_tag="${RELEASE_TAG}"
          mod_version="${release_tag%%+*}"
          minecraft_version="${release_tag#*+}"
          jar_file="dist/villaigence-fabric-${release_tag}.jar"
          checksum_file="${jar_file}.sha256"
          manifest_file="dist/villaigence-dependencies-${release_tag}.txt"
          notes_source="docs/releases/${release_tag}.md"
          test -f "${jar_file}"
          test -f "${checksum_file}"
          test -f "${manifest_file}"

          checksum="$(cat "${checksum_file}")"
          notes_file="release-notes.md"
          if [[ -s "${notes_source}" ]]; then
            cp "${notes_source}" "${notes_file}"
            printf '%s\n' \
              "" \
              "SHA-256:" \
              "${checksum}" \
              "" \
              "The attached dependency manifest records the sorted resolved build coordinates used by this release." \
              >> "${notes_file}"
          else
            printf '%s\n' \
              "# VillAIgence ${mod_version}" \
              "" \
              "Vill-AI-gence — Giving villagers a mind of their own." \
              "" \
              "VillAIgence is an experimental AI-driven evolution of Minecraft Comes Alive Reborn. LivingWorld remains the internal engine name for compatibility-sensitive classes, config and world-data paths." \
              "" \
              "Runtime:" \
              "- Minecraft ${minecraft_version}" \
              "- Fabric Loader" \
              "- Java 21" \
              "- Fabric API for Minecraft ${minecraft_version}" \
              "- Simple Voice Chat 2.6.20 or newer" \
              "" \
              "Important: this JAR intentionally keeps MCA's internal mod id mca. Remove the original MCA Reborn JAR before installing VillAIgence; do not install both at the same time." \
              "" \
              "Server configuration remains config/livingworld.json. API credentials stay server-side." \
              "" \
              "Back up the world before installing or updating experimental builds." \
              "" \
              "SHA-256:" \
              "${checksum}" \
              "" \
              "The attached dependency manifest records the sorted resolved build coordinates used by this release." \
              > "${notes_file}"
          fi

          title="VillAIgence ${mod_version} for Minecraft ${minecraft_version}"

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists; updating metadata and replacing assets."
            if [[ "${mod_version}" == *-* ]]; then
              gh release edit "${release_tag}" \
                --title "${title}" \
                --notes-file "${notes_file}" \
                --draft=false \
                --prerelease=true
            else
              gh release edit "${release_tag}" \
                --title "${title}" \
                --notes-file "${notes_file}" \
                --draft=false \
                --prerelease=false
            fi
            gh release upload "${release_tag}" \
              "${jar_file}" \
              "${checksum_file}" \
              "${manifest_file}" \
              --clobber
          else
            common_args=(
              "${release_tag}"
              "${jar_file}"
              "${checksum_file}"
              "${manifest_file}"
              --verify-tag
              --title "${title}"
              --notes-file "${notes_file}"
            )

            if [[ "${mod_version}" == *-* ]]; then
              gh release create "${common_args[@]}" --prerelease
            else
              gh release create "${common_args[@]}"
            fi
          fi
