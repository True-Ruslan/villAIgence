name: LivingWorld GitHub Release

on:
  push:
    tags:
      - '*+*'
  pull_request:
    branches:
      - '1.21.1'
    paths:
      - '.github/workflows/livingworld-release.yml'
      - 'docs/RELEASING.md'
      - 'scripts/ci/package-livingworld-release.sh'
      - 'docs/superpowers/specs/2026-07-20-github-alpha-release-design.md'
      - 'docs/superpowers/plans/2026-07-20-github-alpha-release.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livingworld-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.metadata.outputs.valid }}
      is_release: ${{ steps.metadata.outputs.is_release }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      minecraft_version: ${{ steps.metadata.outputs.minecraft_version }}
    steps:
      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_EVENT_NAME}" in
            push)
              tag="${GITHUB_REF_NAME}"
              tag_pattern='^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?[+][0-9]+([.][0-9]+){1,2}$'

              if [[ ! "${tag}" =~ ${tag_pattern} ]]; then
                echo "::error title=Invalid release tag::Expected '<mod_version>+<minecraft_version>', for example '0.1.0-alpha.1+1.21.1'."
                exit 1
              fi

              echo "valid=true" >> "$GITHUB_OUTPUT"
              echo "is_release=true" >> "$GITHUB_OUTPUT"
              echo "tag=${tag}" >> "$GITHUB_OUTPUT"
              echo "version=${tag%%+*}" >> "$GITHUB_OUTPUT"
              echo "minecraft_version=${tag#*+}" >> "$GITHUB_OUTPUT"
              ;;
            pull_request)
              echo "valid=true" >> "$GITHUB_OUTPUT"
              echo "is_release=false" >> "$GITHUB_OUTPUT"
              echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
              echo "version=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
              echo "minecraft_version=1.21.1" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "valid=true" >> "$GITHUB_OUTPUT"
              echo "is_release=false" >> "$GITHUB_OUTPUT"
              echo "tag=dry-run-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "version=dry-run-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "minecraft_version=1.21.1" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error title=Unsupported workflow event::${GITHUB_EVENT_NAME}"
              exit 1
              ;;
          esac

  build-and-package:
    needs: metadata
    if: needs.metadata.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
      NO_COLOR: 1
    steps:
      - name: Checkout commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release source and metadata
        if: needs.metadata.outputs.is_release == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          TAG_MINECRAFT_VERSION: ${{ needs.metadata.outputs.minecraft_version }}
        run: |
          set -euo pipefail

          git fetch origin refs/heads/1.21.1:refs/remotes/origin/1.21.1
          tagged_sha="$(git rev-parse HEAD)"
          branch_sha="$(git rev-parse refs/remotes/origin/1.21.1)"

          if [[ "${tagged_sha}" != "${branch_sha}" ]]; then
            echo "::error title=Release tag is not on current 1.21.1 head::Tag commit ${tagged_sha} differs from 1.21.1 ${branch_sha}."
            exit 1
          fi

          configured_minecraft_version="$(grep '^minecraft_version=' gradle.properties | head -n 1 | cut -d= -f2-)"
          if [[ "${TAG_MINECRAFT_VERSION}" != "${configured_minecraft_version}" ]]; then
            echo "::error title=Minecraft version mismatch::Tag declares ${TAG_MINECRAFT_VERSION}, but gradle.properties declares ${configured_minecraft_version}."
            exit 1
          fi

          mapfile -t head_tags < <(git tag --points-at HEAD | sort)
          if [[ "${#head_tags[@]}" -ne 1 || "${head_tags[0]}" != "${RELEASE_TAG}" ]]; then
            echo "::error title=Ambiguous release version::Exactly one tag must point at the release commit and it must be ${RELEASE_TAG}."
            printf 'Tags at HEAD:\n%s\n' "${head_tags[*]:-<none>}"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :common:test :fabric:build --stacktrace --no-daemon --console=plain

      - name: Package and smoke-check release artifact
        id: package
        shell: bash
        env:
          IS_RELEASE: ${{ needs.metadata.outputs.is_release }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/package-livingworld-release.sh
          scripts/ci/package-livingworld-release.sh "${RELEASE_TAG}" "${IS_RELEASE}" dist

      - name: Upload verified Fabric package
        uses: actions/upload-artifact@v4
        with:
          name: livingworld-fabric-${{ needs.metadata.outputs.tag }}
          path: |
            ${{ steps.package.outputs.jar }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

  github-release:
    needs:
      - metadata
      - build-and-package
    if: needs.metadata.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release package
        uses: actions/download-artifact@v4
        with:
          name: livingworld-fabric-${{ needs.metadata.outputs.tag }}
          path: dist

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          MOD_VERSION: ${{ needs.metadata.outputs.version }}
          MINECRAFT_VERSION: ${{ needs.metadata.outputs.minecraft_version }}
        run: |
          set -euo pipefail

          jar_file="dist/mca-livingworld-fabric-${RELEASE_TAG}.jar"
          checksum_file="${jar_file}.sha256"
          test -f "${jar_file}"
          test -f "${checksum_file}"

          checksum="$(cat "${checksum_file}")"
          cat > release-notes.md <<EOF
          # LivingWorld ${MOD_VERSION}

          Experimental alpha/testing build of the LivingWorld fork of Minecraft Comes Alive.

          **Runtime:**
          - Minecraft ${MINECRAFT_VERSION}
          - Fabric Loader
          - Java 21
          - Fabric API for Minecraft ${MINECRAFT_VERSION}
          - Simple Voice Chat 2.6.20 or newer

          **Important:** this JAR keeps MCA's internal mod id mca. Remove the original MCA Reborn JAR before installing this fork; do not install both at the same time.

          For the normal LivingWorld MVP, the server owner only needs to set OPENAI_API_KEY or apiKey in config/livingworld.json after the first server start.

          This is an alpha build intended for controlled testing. Back up the world before installing or updating.

          **SHA-256**

          ~~~text
          ${checksum}
          ~~~
          EOF

          prerelease_args=()
          if [[ "${MOD_VERSION}" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "${RELEASE_TAG}" \
            "${jar_file}" \
            "${checksum_file}" \
            --verify-tag \
            --title "LivingWorld ${MOD_VERSION} for Minecraft ${MINECRAFT_VERSION}" \
            --notes-file release-notes.md \
            "${prerelease_args[@]}"
