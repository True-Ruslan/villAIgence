name: LivingWorld GitHub Release

on:
  push:
    tags:
      - '*+*'
  pull_request:
    branches:
      - '1.21.1'
    paths:
      - '.github/workflows/livingworld-release.yml'
      - 'docs/RELEASING.md'
      - 'scripts/ci/package-livingworld-release.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livingworld-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
      NO_COLOR: 1
    steps:
      - name: Checkout commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve and verify release metadata
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          tag_pattern='^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?[+][0-9]+([.][0-9]+){1,2}$'
          if [[ ! "${tag}" =~ ${tag_pattern} ]]; then
            echo "::error title=Invalid release tag::Expected '<mod_version>+<minecraft_version>', for example '0.1.0-alpha.1+1.21.1'."
            exit 1
          fi

          minecraft_version="${tag#*+}"
          configured_minecraft_version="$(grep '^minecraft_version=' gradle.properties | head -n 1 | cut -d= -f2-)"
          if [[ "${minecraft_version}" != "${configured_minecraft_version}" ]]; then
            echo "::error title=Minecraft version mismatch::Tag declares ${minecraft_version}, but gradle.properties declares ${configured_minecraft_version}."
            exit 1
          fi

          git fetch origin refs/heads/1.21.1:refs/remotes/origin/1.21.1
          tagged_sha="$(git rev-parse HEAD)"
          branch_sha="$(git rev-parse refs/remotes/origin/1.21.1)"
          if [[ "${tagged_sha}" != "${branch_sha}" ]]; then
            echo "::error title=Release tag is not on current 1.21.1 head::Tag commit ${tagged_sha} differs from 1.21.1 ${branch_sha}."
            exit 1
          fi

          mapfile -t head_tags < <(git tag --points-at HEAD | sort)
          if [[ "${#head_tags[@]}" -ne 1 || "${head_tags[0]}" != "${tag}" ]]; then
            echo "::error title=Ambiguous release version::Exactly one tag must point at the release commit and it must be ${tag}."
            printf 'Tags at HEAD:\n%s\n' "${head_tags[*]:-<none>}"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and build Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :common:test :fabric:build --stacktrace --no-daemon --console=plain

      - name: Package and smoke-check artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/ci/package-livingworld-release.sh

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            artifact_label="${GITHUB_REF_NAME}"
            is_release=true
          else
            artifact_label="dry-run-${GITHUB_RUN_NUMBER}"
            is_release=false
          fi

          scripts/ci/package-livingworld-release.sh "${artifact_label}" "${is_release}" dist

      - name: Upload verified Fabric package
        uses: actions/upload-artifact@v4
        with:
          name: livingworld-fabric-package
          path: |
            ${{ steps.package.outputs.jar }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

  github-release:
    needs: build-and-package
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release package
        uses: actions/download-artifact@v4
        with:
          name: livingworld-fabric-package
          path: dist

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"
          mod_version="${release_tag%%+*}"
          minecraft_version="${release_tag#*+}"
          jar_file="dist/mca-livingworld-fabric-${release_tag}.jar"
          checksum_file="${jar_file}.sha256"
          test -f "${jar_file}"
          test -f "${checksum_file}"

          checksum="$(cat "${checksum_file}")"
          cat > release-notes.md <<EOF
          # LivingWorld ${mod_version}

          Experimental alpha/testing build of the LivingWorld fork of Minecraft Comes Alive.

          **Runtime:**
          - Minecraft ${minecraft_version}
          - Fabric Loader
          - Java 21
          - Fabric API for Minecraft ${minecraft_version}
          - Simple Voice Chat 2.6.20 or newer

          **Important:** this JAR keeps MCA's internal mod id mca. Remove the original MCA Reborn JAR before installing this fork; do not install both at the same time.

          For the normal LivingWorld MVP, the server owner only needs to set OPENAI_API_KEY or apiKey in config/livingworld.json after the first server start.

          This is an alpha build intended for controlled testing. Back up the world before installing or updating.

          **SHA-256**

          ~~~text
          ${checksum}
          ~~~
          EOF

          prerelease_args=()
          if [[ "${mod_version}" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "${release_tag}" \
            "${jar_file}" \
            "${checksum_file}" \
            --verify-tag \
            --title "LivingWorld ${mod_version} for Minecraft ${minecraft_version}" \
            --notes-file release-notes.md \
            "${prerelease_args[@]}"
