name: VillAIgence GitHub Release

on:
  push:
    tags:
      - '**'
  pull_request:
    branches:
      - '1.21.1'
    paths:
      - '.github/workflows/livingworld-release.yml'
      - 'docs/RELEASING.md'
      - 'scripts/ci/package-livingworld-release.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: villaigence-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
      NO_COLOR: "1"
    steps:
      - name: Checkout commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve and verify release metadata
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag_pattern='^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?[+][0-9]+([.][0-9]+){1,2}$'
          if [[ ! "${tag}" =~ ${tag_pattern} ]]; then
            echo "::error title=Invalid release tag::Expected '<mod_version>+<minecraft_version>', for example '0.1.5+1.21.1'."
            exit 1
          fi
          minecraft_version="${tag#*+}"
          configured_minecraft_version="$(grep '^minecraft_version=' gradle.properties | head -n 1 | cut -d= -f2-)"
          if [[ "${minecraft_version}" != "${configured_minecraft_version}" ]]; then
            echo "::error title=Minecraft version mismatch::Tag declares ${minecraft_version}, but gradle.properties declares ${configured_minecraft_version}."
            exit 1
          fi
          git fetch origin refs/heads/1.21.1:refs/remotes/origin/1.21.1
          tagged_sha="$(git rev-parse HEAD)"
          branch_sha="$(git rev-parse refs/remotes/origin/1.21.1)"
          if [[ "${tagged_sha}" != "${branch_sha}" ]]; then
            echo "::error title=Release tag is not on current 1.21.1 head::Tag commit ${tagged_sha} differs from 1.21.1 ${branch_sha}."
            exit 1
          fi
          mapfile -t head_tags < <(git tag --points-at HEAD | sort)
          if [[ "${#head_tags[@]}" -ne 1 || "${head_tags[0]}" != "${tag}" ]]; then
            echo "::error title=Ambiguous release version::Exactly one tag must point at the release commit and it must be ${tag}."
            printf 'Tags at HEAD:\n%s\n' "${head_tags[*]:-<none>}"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true

      - name: Run tests and build Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :common:test :fabric:build --stacktrace --no-daemon --console=plain

      - name: Package and smoke-check VillAIgence artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/ci/package-livingworld-release.sh
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            artifact_label="${GITHUB_REF_NAME}"
            is_release=true
          else
            artifact_label="dry-run-${GITHUB_RUN_NUMBER}"
            is_release=false
          fi
          scripts/ci/package-livingworld-release.sh "${artifact_label}" "${is_release}" dist

      - name: Upload verified VillAIgence Fabric package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: villaigence-fabric-package
          path: |
            ${{ steps.package.outputs.jar }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

  github-release:
    needs: build-and-package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified VillAIgence release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: villaigence-fabric-package
          path: dist

      - name: Create or update VillAIgence GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"
          mod_version="${release_tag%%+*}"
          minecraft_version="${release_tag#*+}"
          jar_file="dist/villaigence-fabric-${release_tag}.jar"
          checksum_file="${jar_file}.sha256"
          test -f "${jar_file}"
          test -f "${checksum_file}"

          checksum="$(cat "${checksum_file}")"
          notes_file="release-notes.md"
          printf '%s\n' \
            "# VillAIgence ${mod_version}" \
            "" \
            "Vill-AI-gence — Giving villagers a mind of their own." \
            "" \
            "VillAIgence is an experimental AI-driven evolution of Minecraft Comes Alive Reborn. LivingWorld remains the internal engine name for compatibility-sensitive classes, config and world-data paths." \
            "" \
            "Runtime:" \
            "- Minecraft ${minecraft_version}" \
            "- Fabric Loader" \
            "- Java 21" \
            "- Fabric API for Minecraft ${minecraft_version}" \
            "- Simple Voice Chat 2.6.20 or newer" \
            "" \
            "Important: this JAR intentionally keeps MCA's internal mod id mca. Remove the original MCA Reborn JAR before installing VillAIgence; do not install both at the same time." \
            "" \
            "Server configuration remains config/livingworld.json. API credentials stay server-side." \
            "" \
            "Back up the world before installing or updating experimental builds." \
            "" \
            "SHA-256:" \
            "${checksum}" \
            > "${notes_file}"

          title="VillAIgence ${mod_version} for Minecraft ${minecraft_version}"

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists; updating metadata and replacing assets."
            if [[ "${mod_version}" == *-* ]]; then
              gh release edit "${release_tag}" \
                --title "${title}" \
                --notes-file "${notes_file}" \
                --draft=false \
                --prerelease=true
            else
              gh release edit "${release_tag}" \
                --title "${title}" \
                --notes-file "${notes_file}" \
                --draft=false \
                --prerelease=false
            fi
            gh release upload "${release_tag}" \
              "${jar_file}" \
              "${checksum_file}" \
              --clobber
          else
            common_args=(
              "${release_tag}"
              "${jar_file}"
              "${checksum_file}"
              --verify-tag
              --title "${title}"
              --notes-file "${notes_file}"
            )

            if [[ "${mod_version}" == *-* ]]; then
              gh release create "${common_args[@]}" --prerelease
            else
              gh release create "${common_args[@]}"
            fi
          fi
