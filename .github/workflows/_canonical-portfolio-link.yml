name: Temporary canonical portfolio link patch

on:
  push:
    branches:
      - docs/canonical-portfolio-link

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/canonical-portfolio-link
          fetch-depth: 0
      - name: Patch README and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          canonical = '**Author and engineering portfolio:** [trueruslan.ru](https://trueruslan.ru/)'
          marker = '\n\n> **Experimental software:** back up your world before installing or updating.'
          if canonical in text:
              raise SystemExit('Canonical portfolio link already exists')
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one experimental warning marker, found {text.count(marker)}')
          path.write_text(text.replace(marker, f'\n\n{canonical}{marker}', 1), encoding='utf-8')
          PY
          rm .github/workflows/_canonical-portfolio-link.yml
          test "$(grep -o 'https://trueruslan.ru/' README.md | wc -l | tr -d ' ')" = "1"
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/_canonical-portfolio-link.yml
          git commit -m 'docs: link canonical engineering portfolio'
          git push origin HEAD:docs/canonical-portfolio-link
