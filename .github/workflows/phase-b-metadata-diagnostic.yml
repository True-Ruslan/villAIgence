name: Phase B metadata diagnostic

on:
  pull_request:
    branches:
      - '1.21.1'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Generate exact lock and verification delta
        run: |
          chmod +x gradlew
          ./gradlew \
            :fabric:stageProductionAcceptanceRuntime \
            --write-locks \
            --write-verification-metadata sha256 \
            --no-daemon \
            --console=plain
          git diff --stat -- \
            fabric/gradle.lockfile \
            gradle/verification-metadata.xml
          test -s fabric/build/production-acceptance/stage/manifest.json

      - name: Upload generated supply-chain files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-b-supply-chain-delta
          if-no-files-found: error
          path: |
            fabric/gradle.lockfile
            gradle/verification-metadata.xml
            fabric/build/production-acceptance/stage/manifest.json
