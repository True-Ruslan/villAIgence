name: Ops Apply Tombstone Startup Fix

on:
  push:
    branches:
      - 'fix/0.1.22-tombstone-startup'
    paths:
      - '.github/workflows/ops-apply-tombstone-startup-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/0.1.22-tombstone-startup
          fetch-depth: 0

      - name: Apply deterministic source and package patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          tombstone = Path('common/src/main/java/net/conczin/mca/block/TombstoneBlock.java')
          text = tombstone.read_text(encoding='utf-8')
          old = '''        Optional<Data> data = Data.of(builder.getOptionalParameter(LootContextParams.BLOCK_ENTITY)).filter(Data::hasEntity);

        data.flatMap(Data::getEntityName)
                .ifPresent(name -> {
                    stacks.stream().filter(TombstoneBlock::isRemains).forEach(stack -> {
                        stack.set(DataComponents.CUSTOM_NAME, Component.translatable("block.mca.tombstone.remains", stack.getHoverName(), name));
                    });

                });
        data.ifPresent(be -> {
            stacks.stream().filter(s -> s.getItem() == asItem()).findFirst().ifPresent(be::writeToStack);
        });

        return stacks;
'''
          new = '''        Optional<Data> storedData = Data.of(builder.getOptionalParameter(LootContextParams.BLOCK_ENTITY))
                .filter(Data::hasEntity);

        storedData.flatMap(Data::getEntityName)
                .ifPresent(name -> {
                    stacks.stream().filter(TombstoneBlock::isRemains).forEach(stack -> {
                        stack.set(DataComponents.CUSTOM_NAME, Component.translatable("block.mca.tombstone.remains", stack.getHoverName(), name));
                    });

                });

        return storedData
                .map(data -> TombstoneDropPolicy.ensurePreservedDrop(
                        stacks,
                        stack -> stack.getItem() == asItem(),
                        () -> new ItemStack(asItem()),
                        data::writeToStack
                ))
                .orElse(stacks);
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one TombstoneBlock getDrops wiring block, found {text.count(old)}')
          tombstone.write_text(text.replace(old, new), encoding='utf-8')

          mixins = Path('common/src/main/resources/mca.mixins.json')
          text = mixins.read_text(encoding='utf-8')
          line = '    "MixinTombstoneBlock",\n'
          if text.count(line) != 1:
              raise SystemExit(f'Expected exactly one MixinTombstoneBlock registration, found {text.count(line)}')
          mixins.write_text(text.replace(line, ''), encoding='utf-8')

          obsolete = Path('common/src/main/java/net/conczin/mca/mixin/MixinTombstoneBlock.java')
          if not obsolete.is_file():
              raise SystemExit('Expected obsolete MixinTombstoneBlock.java to exist')
          obsolete.unlink()

          fabric = Path('fabric/build.gradle')
          text = fabric.read_text(encoding='utf-8')
          anchor = '''            def commonMixins = mixinConfig.mixins instanceof List ? mixinConfig.mixins : []
            if (!commonMixins.contains('MixinGroundPathNavigation')) {
'''
          replacement = '''            def commonMixins = mixinConfig.mixins instanceof List ? mixinConfig.mixins : []
            if (commonMixins.contains('MixinTombstoneBlock')) {
                throw new GradleException(
                        "mca.mixins.json must not register MixinTombstoneBlock for owned TombstoneBlock behavior: ${jarFile}"
                )
            }
            if (zip.getEntry('net/conczin/mca/mixin/MixinTombstoneBlock.class') != null) {
                throw new GradleException(
                        "Distributable Fabric JAR must not contain obsolete MixinTombstoneBlock.class: ${jarFile}"
                )
            }
            if (refmap.mappings['net/conczin/mca/mixin/MixinTombstoneBlock'] != null) {
                throw new GradleException(
                        "${refmapEntryName} must not contain obsolete MixinTombstoneBlock mappings: ${jarFile}"
                )
            }

            def tombstoneBlockEntry = zip.getEntry('net/conczin/mca/block/TombstoneBlock.class')
            if (tombstoneBlockEntry == null) {
                throw new GradleException("Distributable Fabric JAR is missing TombstoneBlock.class: ${jarFile}")
            }
            def tombstoneBlockConstants = new String(
                    zip.getInputStream(tombstoneBlockEntry).bytes,
                    java.nio.charset.StandardCharsets.ISO_8859_1
            )
            if (!tombstoneBlockConstants.contains('net/conczin/mca/block/TombstoneDropPolicy')
                    || !tombstoneBlockConstants.contains('ensurePreservedDrop')) {
                throw new GradleException(
                        "TombstoneBlock must wire TombstoneDropPolicy.ensurePreservedDrop directly: ${jarFile}"
                )
            }

            if (!commonMixins.contains('MixinGroundPathNavigation')) {
'''
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one Fabric package anchor, found {text.count(anchor)}')
          fabric.write_text(text.replace(anchor, replacement), encoding='utf-8')
          PY

          git diff --check
          git diff --stat

      - name: Commit patch to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            common/src/main/java/net/conczin/mca/block/TombstoneBlock.java \
            common/src/main/java/net/conczin/mca/mixin/MixinTombstoneBlock.java \
            common/src/main/resources/mca.mixins.json \
            fabric/build.gradle
          git commit -m 'fix: wire filled tombstone drops without mixin'
          git push origin HEAD:refs/heads/fix/0.1.22-tombstone-startup
