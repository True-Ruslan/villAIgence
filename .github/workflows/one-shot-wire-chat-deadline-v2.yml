name: One-shot wire Chat deadline v2

on:
  push:
    branches:
      - agent/m11-phase-c-orchestration-deadline
    paths:
      - .github/workflows/one-shot-wire-chat-deadline-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/m11-phase-c-orchestration-deadline
          fetch-depth: 0
      - name: Wire shared deadline through Chat
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: {label}: expected 1 anchor, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def regex_once(path: Path, pattern: str, replacement: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f'{path}: {label}: expected 1 structural match, found {count}')
              path.write_text(updated, encoding='utf-8')

          chat = Path('common/src/main/java/net/conczin/mca/entity/ai/chatAI/ChatAI.java')
          replace_once(
              chat,
              'import net.conczin.mca.livingworld.LivingWorldConfig;\n',
              'import net.conczin.mca.livingworld.LivingWorldConfig;\nimport net.conczin.mca.livingworld.ai.AiRequestDeadline;\n',
              'ChatAI deadline import'
          )
          old_chat_header = (
              '    public static Optional<String> answer(\n'
              '            MinecraftServer server,\n'
              '            ServerPlayer player,\n'
              '            VillagerEntityMCA villager,\n'
              '            String msg,\n'
              '            LivingWorldContextSnapshot snapshot\n'
              '    ) {\n'
              '        ChatAIStrategy strategy = computeStrategyIfAbsent(snapshot.villagerId());\n'
          )
          new_chat_header = (
              '    public static Optional<String> answer(\n'
              '            MinecraftServer server,\n'
              '            ServerPlayer player,\n'
              '            VillagerEntityMCA villager,\n'
              '            String msg,\n'
              '            LivingWorldContextSnapshot snapshot\n'
              '    ) {\n'
              '        return answer(server, player, villager, msg, snapshot, null);\n'
              '    }\n\n'
              '    public static Optional<String> answer(\n'
              '            MinecraftServer server,\n'
              '            ServerPlayer player,\n'
              '            VillagerEntityMCA villager,\n'
              '            String msg,\n'
              '            LivingWorldContextSnapshot snapshot,\n'
              '            AiRequestDeadline deadline\n'
              '    ) {\n'
              '        ChatAIStrategy strategy = computeStrategyIfAbsent(snapshot.villagerId());\n'
          )
          replace_once(chat, old_chat_header, new_chat_header, 'ChatAI snapshot overload')
          replace_once(
              chat,
              'Optional<String> answer = openAIChatAI.answer(server, player, villager, msg, snapshot);',
              'Optional<String> answer = openAIChatAI.answer(server, player, villager, msg, snapshot, deadline);',
              'ChatAI OpenAI delegation'
          )

          openai = Path('common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java')
          replace_once(
              openai,
              'import net.conczin.mca.livingworld.ai.AiProviderSettings;\n',
              'import net.conczin.mca.livingworld.ai.AiProviderSettings;\nimport net.conczin.mca.livingworld.ai.AiRequestDeadline;\n',
              'OpenAI deadline import'
          )
          old_snapshot_header = (
              '    public Optional<String> answer(\n'
              '            MinecraftServer server,\n'
              '            ServerPlayer player,\n'
              '            VillagerEntityMCA villager,\n'
              '            String msg,\n'
              '            LivingWorldContextSnapshot snapshot\n'
              '    ) {\n'
              '        try {\n'
          )
          new_snapshot_header = (
              '    public Optional<String> answer(\n'
              '            MinecraftServer server,\n'
              '            ServerPlayer player,\n'
              '            VillagerEntityMCA villager,\n'
              '            String msg,\n'
              '            LivingWorldContextSnapshot snapshot\n'
              '    ) {\n'
              '        return answer(server, player, villager, msg, snapshot, null);\n'
              '    }\n\n'
              '    public Optional<String> answer(\n'
              '            MinecraftServer server,\n'
              '            ServerPlayer player,\n'
              '            VillagerEntityMCA villager,\n'
              '            String msg,\n'
              '            LivingWorldContextSnapshot snapshot,\n'
              '            @Nullable AiRequestDeadline deadline\n'
              '    ) {\n'
              '        try {\n'
          )
          replace_once(openai, old_snapshot_header, new_snapshot_header, 'OpenAI snapshot overload')
          replace_once(
              openai,
              '            String token = provider.usePlayerNameAsToken() ? snapshot.playerName() : provider.apiKey();\n'
              '            Answer response = post(provider, body.toString(), token);\n',
              '            String token = provider.usePlayerNameAsToken() ? snapshot.playerName() : provider.apiKey();\n'
              '            Answer response = post(provider, body.toString(), token, deadline);\n',
              'snapshot shared deadline'
          )
          replace_once(
              openai,
              '                DEFAULT_READ_TIMEOUT_MILLIS,\n'
              '                "<unspecified>"\n',
              '                DEFAULT_READ_TIMEOUT_MILLIS,\n'
              '                "<unspecified>",\n'
              '                null\n',
              'legacy post null deadline'
          )

          post_region = r'''    private static Answer post\(AiProviderSettings settings, String requestBody, String token\) \{.*?^        if \(result\.failure\(\) instanceof BoundedResponseReader\.ResponseTooLargeException exception\) \{'''
          post_replacement = '''    private static Answer post(AiProviderSettings settings, String requestBody, String token) {
              return post(settings, requestBody, token, null);
          }

          private static Answer post(
                  AiProviderSettings settings,
                  String requestBody,
                  String token,
                  @Nullable AiRequestDeadline deadline
          ) {
              return post(
                      settings.endpoint(),
                      requestBody,
                      token,
                      settings.connectTimeoutMillis(),
                      settings.readTimeoutMillis(),
                      settings.model(),
                      deadline
              );
          }

          private static Answer post(
                  ProviderEndpoint endpoint,
                  String requestBody,
                  String token,
                  int connectTimeoutMillis,
                  int readTimeoutMillis,
                  String model,
                  @Nullable AiRequestDeadline deadline
          ) {
              ChatCompletionHttpClient.AttemptObserver observer = new ChatCompletionHttpClient.AttemptObserver() {
                  @Override
                  public void onProviderFailure(
                          int attempt,
                          ChatCompletionResponseParser.ParsedCompletion completion
                  ) {
                      logProviderFailure(model, attempt, completion);
                  }

                  @Override
                  public void onEmptyCompletion(
                          int attempt,
                          ChatCompletionResponseParser.ParsedCompletion completion,
                          boolean retrying
                  ) {
                      logEmptyCompletion(model, attempt, completion, retrying);
                  }
              };
              ChatCompletionHttpClient.Result result = deadline == null
                      ? ChatCompletionHttpClient.post(
                              endpoint,
                              requestBody,
                              token,
                              connectTimeoutMillis,
                              readTimeoutMillis,
                              observer
                      )
                      : ChatCompletionHttpClient.post(
                              endpoint,
                              requestBody,
                              token,
                              connectTimeoutMillis,
                              readTimeoutMillis,
                              deadline,
                              observer
                      );

              if (result.failure() instanceof BoundedResponseReader.ResponseTooLargeException exception) {'''
          regex_once(openai, post_region, post_replacement, 'OpenAI transport wrapper region')

          if openai.read_text(encoding='utf-8').count('applySnapshotRelationshipDelta(') != 1:
              raise SystemExit('OpenAI relationship commit site changed unexpectedly')
          PY
          git diff --check
          grep -Fq 'openAIChatAI.answer(server, player, villager, msg, snapshot, deadline)' common/src/main/java/net/conczin/mca/entity/ai/chatAI/ChatAI.java
          grep -Fq 'post(provider, body.toString(), token, deadline)' common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java
          grep -Fq 'AiRequestDeadline deadline,' common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java
      - name: Commit Chat wiring
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add common/src/main/java/net/conczin/mca/entity/ai/chatAI/ChatAI.java common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java
          git commit -m 'feat: share voice deadline with Chat retries'
          git push origin HEAD:agent/m11-phase-c-orchestration-deadline
