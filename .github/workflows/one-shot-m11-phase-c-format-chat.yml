name: One-shot M11 Phase C source normalization

on:
  push:
    branches:
      - agent/m11-phase-c-mock-provider
    paths:
      - .github/workflows/one-shot-m11-phase-c-format-chat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/m11-phase-c-mock-provider
          fetch-depth: 0

      - name: Normalize production chat integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java')
          source = path.read_text(encoding='utf-8')
          source = source.replace('import net.conczin.mca.livingworld.ai.ProviderResponseLimits;\n', '')

          parse_start = source.index('    private static ParsedProviderAnswer parseAnswer(String body) {')
          parse_end = source.index('    private static String parseError(', parse_start)
          parse_lines = [
              '    private static ParsedProviderAnswer parseAnswer(String body) {',
              '        return parseCompletion(ChatCompletionResponseParser.parse(body));',
              '    }',
              '',
              '    private static ParsedProviderAnswer parseCompletion(',
              '            @Nullable ChatCompletionResponseParser.ParsedCompletion completion',
              '    ) {',
              '        if (completion == null) {',
              '            return new ParsedProviderAnswer(new Answer(null, null), null);',
              '        }',
              '        if (completion.error() != null) {',
              '            return new ParsedProviderAnswer(new Answer(null, completion.error()), completion);',
              '        }',
              '',
              '        String content = completion.content();',
              '        if (content == null) {',
              '            return new ParsedProviderAnswer(new Answer(null, null), completion);',
              '        }',
              '',
              '        StructuredAiResponseParser.ParsedResponse parsed = StructuredAiResponseParser.parse(content);',
              '        StructuredResponse reply = new StructuredResponse(',
              '                parsed.message(),',
              '                parsed.optionalCommand(),',
              '                parsed.relationshipDelta()',
              '        );',
              '        if (parsed.message() == null) {',
              '            MCA.LOGGER.warn("AI answer contained no usable user-visible message after structured response sanitization");',
              '        }',
              '        return new ParsedProviderAnswer(new Answer(reply, null), completion);',
              '    }',
              '',
          ]
          source = source[:parse_start] + '\n'.join(parse_lines) + source[parse_end:]

          post_start = source.index('    private static Answer post(\n')
          post_end = source.index('    private static void logProviderFailure(', post_start)
          post_lines = [
              '    private static Answer post(',
              '            ProviderEndpoint endpoint,',
              '            String requestBody,',
              '            String token,',
              '            int connectTimeoutMillis,',
              '            int readTimeoutMillis,',
              '            String model',
              '    ) {',
              '        ChatCompletionHttpClient.Result result = ChatCompletionHttpClient.post(',
              '                endpoint,',
              '                requestBody,',
              '                token,',
              '                connectTimeoutMillis,',
              '                readTimeoutMillis,',
              '                new ChatCompletionHttpClient.AttemptObserver() {',
              '                    @Override',
              '                    public void onProviderFailure(',
              '                            int attempt,',
              '                            ChatCompletionResponseParser.ParsedCompletion completion',
              '                    ) {',
              '                        logProviderFailure(model, attempt, completion);',
              '                    }',
              '',
              '                    @Override',
              '                    public void onEmptyCompletion(',
              '                            int attempt,',
              '                            ChatCompletionResponseParser.ParsedCompletion completion,',
              '                            boolean retrying',
              '                    ) {',
              '                        logEmptyCompletion(model, attempt, completion, retrying);',
              '                    }',
              '                }',
              '        );',
              '',
              '        if (result.failure() instanceof BoundedResponseReader.ResponseTooLargeException exception) {',
              '            MCA.LOGGER.warn(',
              '                    "AI provider response exceeded safe byte limit: limit={}, observed={}",',
              '                    exception.limitBytes(),',
              '                    exception.observedBytes()',
              '            );',
              '        } else if (result.failure() != null) {',
              '            MCA.LOGGER.error("AI provider request failed", result.failure());',
              '        }',
              '        if (result.error() != null) {',
              '            return new Answer(null, result.error());',
              '        }',
              '        return parseCompletion(result.completion()).answer();',
              '    }',
              '',
          ]
          source = source[:post_start] + '\n'.join(post_lines) + source[post_end:]

          if source.count('ChatCompletionHttpClient.post(') != 1:
              raise SystemExit('expected one production transport delegation')
          if 'postOnce(' in source:
              raise SystemExit('legacy chat transport remained')
          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/one-shot-m11-phase-c-format-chat.yml').unlink()
          PY

          git diff --check
          grep -Fq 'ChatCompletionHttpClient.post(' common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java
          ! grep -Fq 'postOnce(' common/src/main/java/net/conczin/mca/entity/ai/chatAI/OpenAIChatAI.java

      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: normalize Phase C production integration'
          git push origin HEAD:agent/m11-phase-c-mock-provider
